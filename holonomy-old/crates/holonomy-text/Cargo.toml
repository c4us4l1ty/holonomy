# CAGR gap-rope leaves, style spans, undo and search.
#
# The dependency on holonomy-jail is the single allocation chokepoint -- see
# crates/holonomy-jail/src/lib.rs for why every crate has it.
[package]
name = "holonomy-text"
description = "CAGR gap-rope leaves, style spans, undo and search"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
holonomy-jail = { path = "../holonomy-jail" }
holonomy-secure = { path = "../holonomy-secure" }

# `AssetId` is BLAKE2b-256 over a PNG's encoded bytes. Already in the lock file via holonomy-crypto
# (`Blake2b512`, the same construction at a different output length), so this adds no new transitive
# dependency and no new binary cost -- only the 256-bit variant gets linked.
blake2 = "0.11"

# The undo stack zeroizes through this crate rather than a hand-rolled volatile write, so the
# scrub is the audited implementation and not a local one that could be optimised away.
zeroize = "1.9"

# Dev-dependency only: the latency test measures the Fenwick lookup's cost, so it needs the
# geometry crate. The library itself does not depend on it -- the rope knows nothing about layout.
[dev-dependencies]
holonomy-geometry = { path = "../holonomy-geometry" }

# The Ctrl+T gate drives the real keymap rather than calling `insert_table` with the dimensions
# written out, because "does Ctrl+T reach the table code" is the requirement and calling the table code
# directly would not test it. A dev-dependency, not a normal one: `holonomy-text` must not depend on
# the input layer, or the text engine grows a notion of a keystroke.
holonomy-input = { path = "../holonomy-input" }

# The gate reads `RLIMIT_MEMLOCK` with `getrlimit`, to report the page-lock ceiling rather than a
# remembered one. The library itself uses libc only through holonomy-secure.
libc = "0.2"