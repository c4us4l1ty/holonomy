# The Scanout trait: DrmScanout and HeadlessScanout.
#
# `libc` for the `errno` values in `drm::errno_name`. The dependency on holonomy-jail is the single
# allocation chokepoint -- see crates/holonomy-jail/src/lib.rs for why every crate has it.
[package]
name = "holonomy-display"
description = "The Scanout trait: DrmScanout and HeadlessScanout"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
holonomy-assets = { path = "../holonomy-assets" }
holonomy-jail = { path = "../holonomy-jail" }
holonomy-render = { path = "../holonomy-render" }
# Only for the developer window. Optional, so a default build never links a socket client.
holonomy-x11 = { path = "../holonomy-x11", optional = true }
libc = "0.2"

[features]
# Everything that needs a DRM device. PROJECT.md 2.7: CI must never depend on hardware-only paths, and
# the gate's visual baseline is a PPM rather than a readback from an i915 driver.
hardware = []
# The developer window. Off by default, not part of the sealed boot chain, and the release artifact
# test in `crates/holonomy/tests/release_artifact.rs` asserts a default-features binary holds none of it.
desktop = ["dep:holonomy-x11"]