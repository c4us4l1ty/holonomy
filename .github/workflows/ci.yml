name: v6 CI

# This workflow IS the compiler until a sandboxed local toolchain exists (AUDIT OQ-1).
# Every push must come back green: format, lint, test, and the gates contract.

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:

concurrency:
  group: v6-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

permissions:
  contents: read
  issues: write

jobs:
  # Temporary lockfile bootstrap for the repository's first committed workspace lock.
  # Remove this job once Cargo.lock is checked in and every cargo command uses --locked.
  lockfile-bootstrap:
    name: lockfile bootstrap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo generate-lockfile
      - uses: actions/upload-artifact@v4
        with:
          name: workspace-lockfile
          path: Cargo.lock
          retention-days: 1

  # Diagnostics bridge: the sandbox reads api.github.com but cannot reach the Actions log
  # hosts, so any failing step's output is posted to the pinned diagnostics issue.
  diag:
    name: diagnostics bridge
    runs-on: ubuntu-latest
    if: always() && failure()
    needs: [fmt, clippy, test, gates]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Reproduce each command and post output to the diag issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIAG_ISSUE: "51"
        run: |
          set +e
          {
            echo '### diag: workflow commands, verbatim output'
            echo '```'
            for cmd in \
              "cargo fmt --all -- --check" \
              "cargo clippy --workspace --all-targets -- -D warnings" \
              "cargo test --workspace" \
              "cargo run -p xtask -- gates --check"; do
              echo "== $cmd"
              eval "$cmd" 2>&1 | head -c 12000
              echo "(exit ${PIPESTATUS[0]})"
              echo
            done
            echo '```'
          } > diag.md
          head -c 60000 diag.md > diag-trim.md
          gh issue comment "$DIAG_ISSUE" --body-file diag-trim.md

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # rust-toolchain.toml in the repo root pins channel + components
        # (rustfmt, clippy); the dtolnay action honors that file.
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  gates:
    name: gates contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The human-readable contract must be byte-fresh from the law table in code.
      - run: cargo run -p xtask -- gates --check
      # The gate machinery itself is tested: allocator counting, laws, timing.
      - run: cargo test -p holonomy-ledger --release
