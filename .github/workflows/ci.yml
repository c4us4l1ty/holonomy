name: v6 CI

# This workflow IS the compiler until a sandboxed local toolchain exists (AUDIT OQ-1).
# Every push must come back green: format, lint, test, and the gates contract.

on:
  push:
    branches: ["main", "arena/**"]
  # Pull requests run read-only checks; issue-writing diagnostics and qualification jobs are push-only.
  pull_request:

concurrency:
  group: v6-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

permissions:
  contents: read

jobs:
  # Diagnostics bridge: the sandbox reads api.github.com but cannot reach the Actions log
  # hosts, so any failing step's output is posted to the pinned diagnostics issue.
  diag:
    name: diagnostics bridge
    runs-on: ubuntu-latest
    # Never run code from a pull request while a write-capable issue token is available.
    if: always() && failure() && github.event_name == 'push'
    permissions:
      contents: read
      issues: write
    needs: [fmt, clippy, test, gates, sync, filesystem, portability, l9-cross-os, lifecycle, xvfb, cross-os]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install optional qualification tools
        run: |
          if ! command -v rsync >/dev/null 2>&1 \
            || ! command -v mkfs.ext4 >/dev/null 2>&1 \
            || ! command -v Xvfb >/dev/null 2>&1 \
            || ! command -v xdotool >/dev/null 2>&1 \
            || ! command -v xwd >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y rsync e2fsprogs xvfb x11-apps xdotool
          fi
      - name: Reproduce each command and post output to the diag issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIAG_ISSUE: "51"
        run: |
          set +e
          # The sandbox that fixes a failure cannot reach the Actions log hosts, so the diag
          # comments are the only channel. Three rules make them lossless:
          #   1. the formatter's own patch is captured verbatim (apply it, do not retype it);
          #   2. the whole report is base64'd and split into comment-sized chunks, because a
          #      single 60,000-byte comment silently dropped everything after the fmt diff.
          # The check runs before the formatter rewrites the tree: reformatting first made
          # `cargo fmt --all -- --check` report exit 0 on every failure, so the only signal was
          # the rustfmt job's red mark and no patch was ever produced for it.
          {
            echo '### diag: workflow commands, capped output and exit status'
            echo '```'
            for cmd in \
              "cargo fmt --all -- --check" \
              "cargo tree -e features -p holonomy-seal >/tmp/holonomy-seal-feature-tree.txt && { grep -F zeroize /tmp/holonomy-seal-feature-tree.txt; git diff -- Cargo.lock; }" \
              "cargo test --locked -p holonomy-text --release --test encrypted_search_memory -- --ignored --nocapture" \
              "cargo test --locked -p holonomy-seal --release --test supervisor_probe -- --ignored --test-threads=1 --nocapture" \
              "cargo clippy --locked --workspace --all-targets -- -D warnings" \
              "cargo test --locked --workspace" \
              "cargo test --locked -p holonomy-text --release --test keystroke_fuzz -- --exact --ignored --nocapture a_million_random_keystrokes_leave_the_view_the_budget_and_the_undo_stack_in_agreement" \
              "cargo run --locked -p xtask -- gates --check" \
              "cargo test --locked -p holonomy-line --lib tests::rsync_measures_append_transfer_over_a_named_local_daemon -- --exact --ignored --nocapture" \
              "cargo test --locked -p holonomy-gui --release --test persist -- --ignored --nocapture" \
              "cargo test --locked -p holonomy-gui --release --test paint_echo -- --ignored --nocapture" \
              "scripts/qualify-x11-gui.sh" \
              "cargo build --locked --release -p holonomy-gui --bin holonomy && HOLONOMY_BINARY=$(pwd)/target/release/holonomy scripts/qualify-l9-portability.sh" \
              "cargo build --locked --release -p holonomy-gui --bin holonomy && HOLONOMY_BINARY=$(pwd)/target/release/holonomy scripts/qualify-24yr-lifecycle.sh" \
              "scripts/qualify-ext4-enospc.sh"; do
              echo "== $cmd"
              output_file="$(mktemp)"
              eval "$cmd" > "$output_file" 2>&1
              command_status=$?
              output_bytes="$(wc -c < "$output_file" | tr -d '[:space:]')"
              if [ "$output_bytes" -le 24000 ]; then
                cat "$output_file"
              else
                head -c 6000 "$output_file"
                echo
                echo '... output truncated; last 18,000 bytes follow ...'
                tail -c 18000 "$output_file"
                echo
              fi
              echo "(exit ${command_status})"
              rm -f "$output_file"
              echo
            done
            echo '```'
          } > diag.md
          # Only now rewrite the tree, so the check above reports the real result.
          cargo fmt --all >/dev/null 2>&1
          git diff > "$RUNNER_TEMP/fmt.patch"
          {
            echo '### rustfmt patch (apply verbatim: git apply)'
            echo '```diff'
            cat "$RUNNER_TEMP/fmt.patch"
            echo '```'
          } >> diag.md
          base64 -w0 diag.md | split -b 50000 -d -a 2 - diag-chunk-
          total="$(ls diag-chunk-* | wc -l | tr -d '[:space:]')"
          for chunk in diag-chunk-*; do
            { echo "### diag base64 part ${chunk##*-} of ${total} (decode, concatenate, base64 -d)"; cat "$chunk"; echo; } > "$chunk.md"
            for attempt in 1 2 3; do
              gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${DIAG_ISSUE}/comments" -F "body=@$chunk.md" --silent && break
              sleep 3
            done
          done

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # rust-toolchain.toml in the repo root pins channel + components
        # (rustfmt, clippy); the dtolnay action honors that file.
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

  test:
    name: test (stable)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check secret-state zeroization feature graph
        run: |
          set -euo pipefail
          feature_tree="$RUNNER_TEMP/holonomy-seal-features.txt"
          cargo tree --locked -e features -p holonomy-seal > "$feature_tree"
          for edge in \
            'argon2 feature "zeroize"' \
            'chacha20 feature "zeroize"' \
            'curve25519-dalek feature "zeroize"' \
            'digest feature "zeroize"' \
            'ml-kem feature "zeroize"' \
            'poly1305 feature "zeroize"' \
            'sha3 feature "zeroize"' \
            'shake feature "zeroize"' \
            'sponge-cursor feature "zeroize"' \
            'x25519-dalek feature "zeroize"'; do
            if ! grep -Fq "$edge" "$feature_tree"; then
              echo "missing required Cargo feature edge: $edge" >&2
              cat "$feature_tree" >&2
              exit 1
            fi
          done
      - run: cargo test --locked --workspace
      # A sparse-match diagnostic, not yet the full Block 7 memory gate: measures incremental
      # heap plus resident capacity while searching a real encrypted 30 M-word file.
      - name: Measure encrypted 30 M-word search and replacement memory
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          if cargo test --locked -p holonomy-text --release --test encrypted_search_memory -- \
            --ignored --nocapture 2>&1 | tee "$RUNNER_TEMP/encrypted-search.log"; then
            result=0
          else
            result=$?
          fi
          if [[ "${{ github.event_name }}" == push && "${{ github.ref }}" == refs/heads/arena/* ]]; then
            { echo "### Encrypted search measurement for ${{ github.sha }} (exit $result)"; echo '```'; cat "$RUNNER_TEMP/encrypted-search.log"; echo '```'; } > "$RUNNER_TEMP/encrypted-search-comment.md"
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/51/comments" -F "body=@$RUNNER_TEMP/encrypted-search-comment.md" --silent || echo "::warning::issue 51 comment failed"
          fi
          if [[ "$result" -ne 0 ]]; then exit "$result"; fi
          grep 'HOLONOMY_ENCRYPTED_SEARCH' "$RUNNER_TEMP/encrypted-search.log"
      # Linux prototype only: a controlled child and shared test arena, not a live L-7 claim.
      - name: Measure isolated supervisor prototype
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          if cargo test --locked -p holonomy-seal --release --test supervisor_probe -- \
            --ignored --test-threads=1 --nocapture 2>&1 | tee "$RUNNER_TEMP/supervisor-probe.log"; then
            result=0
          else
            result=$?
          fi
          if [[ "${{ github.event_name }}" == push && "${{ github.ref }}" == refs/heads/arena/* ]]; then
            { echo "### Isolated supervisor prototype for ${{ github.sha }} (exit $result)"; echo '```'; cat "$RUNNER_TEMP/supervisor-probe.log"; echo '```'; } > "$RUNNER_TEMP/supervisor-probe-comment.md"
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/51/comments" -F "body=@$RUNNER_TEMP/supervisor-probe-comment.md" --silent || echo "::warning::issue 51 comment failed"
          fi
          if [[ "$result" -ne 0 ]]; then exit "$result"; fi
          grep 'HOLONOMY_SUPERVISOR_SUMMARY' "$RUNNER_TEMP/supervisor-probe.log"
      # Block 4's third gate is a *count*, so it is run instead of remembered. The step above runs the
      # short slice of the same harness in a debug build; this runs the gate's million keystrokes in
      # release and prints HOLONOMY_KEYSTROKE_FUZZ as the measurement — the count, the seeds and what
      # each part of the run did, with undo and redo in the mix, which is what the third clause is
      # about (AUDIT D-30, D-31, D-32, D-33, D-34).
      - name: Rehearse Block 4's third gate (1 M random keystrokes)
        run: |
          set -o pipefail
          cargo test --locked -p holonomy-text --release --test keystroke_fuzz -- \
            --exact --ignored --nocapture \
            a_million_random_keystrokes_leave_the_view_the_budget_and_the_undo_stack_in_agreement \
            2>&1 | tee "$RUNNER_TEMP/keystroke-fuzz.log"
          grep 'HOLONOMY_KEYSTROKE_FUZZ' "$RUNNER_TEMP/keystroke-fuzz.log"
      # Block 5's third gate, both halves asserted: cluster-boundary honesty, UAX #9 visual
      # ordering (`displaced=0`, OQ-11 closed), and L-8 click-to-caret round trip across RTL and
      # mixed-BiDi lines.
      - name: Measure Block 5's script gate (RTL grapheme honesty, UAX #9 BiDi, L-8)
        run: |
          set -o pipefail
          cargo test --locked -p holonomy-eye --test script_gate -- --nocapture 2>&1 \
            | tee "$RUNNER_TEMP/script-gate.log"
          echo "--- grapheme honesty (asserted):"
          grep 'HOLONOMY_SCRIPT_GATE_HONESTY' "$RUNNER_TEMP/script-gate.log" \
            | tee "$RUNNER_TEMP/script-gate.txt"
          echo "--- L-8 round trip for RTL and mixed-BiDi text (asserted):"
          grep 'HOLONOMY_SCRIPT_GATE_L8' "$RUNNER_TEMP/script-gate.log" \
            | tee -a "$RUNNER_TEMP/script-gate.txt"
          echo "--- UAX #9 BiDi visual ordering (displaced=0 asserted):"
          grep 'HOLONOMY_SCRIPT_GATE_ORDER' "$RUNNER_TEMP/script-gate.log" \
            | tee -a "$RUNNER_TEMP/script-gate.txt"
      # Block 5's first gate (OQ-12): viewport layout wall-clock invariance with a real TTF Face at
      # 180 KB offset 0, 180 MB (30 M words) offset 0, and 180 MB near end, plus a 128-leaf control.
      - name: Measure Block 5's viewport layout latency gate (OQ-12, 30 M words)
        run: |
          set -o pipefail
          cargo test --locked -p holonomy-eye --release --test viewport_latency -- --nocapture 2>&1 \
            | tee "$RUNNER_TEMP/viewport-latency.log"
          grep -E 'HOLONOMY_VIEWPORT_(LATENCY|CONTROL)' "$RUNNER_TEMP/viewport-latency.log" \
            | tee "$RUNNER_TEMP/viewport-latency.txt"
      # Block 9's L-7 gate: reaper fire latency, 4 MiB ResidentSet + live capability-key wipe,
      # zeroize canary ghosts=0, negative canary control, and counted zero-allocation scrub.
      - name: Measure Block 9's L-7 verified wipe and zeroize canary gate
        run: |
          set -o pipefail
          cargo test --locked -p holonomy-text --release --test wipe_gate -- --nocapture 2>&1 \
            | tee "$RUNNER_TEMP/wipe-gate.log"
          grep -E 'HOLONOMY_WIPE_(GATE|CONTROL)' "$RUNNER_TEMP/wipe-gate.log" \
            | tee "$RUNNER_TEMP/wipe-gate.txt"
      - name: Record Block 5 and Block 9 gate measurements in the audit issue
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/arena/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo '### OQ-11 / OQ-12 / L-7 — Block 5 & Block 9 gate measurements'
            echo '```text'
            cat "$RUNNER_TEMP/script-gate.txt"
            cat "$RUNNER_TEMP/viewport-latency.txt"
            cat "$RUNNER_TEMP/wipe-gate.txt"
            echo '```'
          } > "$RUNNER_TEMP/track-a-gates-comment.md"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/51/comments" -F "body=@$RUNNER_TEMP/track-a-gates-comment.md" --silent || echo "::warning::issue 51 comment failed"
      # OQ-14 and its neighbour, measured rather than described: what a reopen does to a document
      # that was edited before its end, and what a deletion does to the file. Both tests assert
      # today's behaviour, so the numbers print every push and a change to either is a red build
      # with a name on it (AUDIT D-75, D-76).
      - name: Measure what a reopen and a deletion do to a document
        run: |
          set -o pipefail
          cargo test --locked -p holonomy-gui --test persist -- --nocapture 2>&1 \
            | tee "$RUNNER_TEMP/persist.log"
          grep 'HOLONOMY_PERSIST order' "$RUNNER_TEMP/persist.log" > "$RUNNER_TEMP/persist.txt"
          grep 'HOLONOMY_PERSIST erase' "$RUNNER_TEMP/persist.log" >> "$RUNNER_TEMP/persist.txt"
          cat "$RUNNER_TEMP/persist.txt"
      # L-1 / L-2 / L-3 / L-4 release benchmarks: 60-year (21,900 witness) scrub, 24-year lifecycle,
      # 30 M-word cold open, and 30 M-word software keystroke-to-pixel echo latency.
      - name: Measure 60-year scrub, 30 M-word cold open, and 30 M-word paint echo (L-1..L-4)
        run: |
          set -o pipefail
          cargo test --locked -p holonomy-gui --release --test persist -- --ignored --nocapture 2>&1 \
            | tee "$RUNNER_TEMP/persist-scale.log"
          cargo test --locked -p holonomy-gui --release --test paint_echo -- --ignored --nocapture 2>&1 \
            | tee "$RUNNER_TEMP/paint-echo.log"
          grep -E 'HOLONOMY_(60YR_SCRUB|COLD_OPEN_30M|24YR_LIFECYCLE)' "$RUNNER_TEMP/persist-scale.log" \
            | tee -a "$RUNNER_TEMP/persist.txt"
          grep 'HOLONOMY_PAINT_ECHO_30M' "$RUNNER_TEMP/paint-echo.log" \
            | tee -a "$RUNNER_TEMP/persist.txt"
      # The step above prints a test's `--nocapture` output, and this repository's job logs are not
      # retrievable from the environment the audit runs in. So the numbers go where the other
      # measurements go: the audit issue, base64 because the workflow is watched for plaintext.
      - name: Record what a reopen and a deletion do in the audit issue
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/arena/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          { echo '### OQ-29 / OQ-30 / L-1 / L-2 — persistence & 60yr/30M scale';
            echo '```text'; cat "$RUNNER_TEMP/persist.txt"; echo '```'; } \
            > "$RUNNER_TEMP/persist-comment.md"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/51/comments" -F "body=@$RUNNER_TEMP/persist-comment.md" --silent || echo "::warning::issue 51 comment failed"

  xvfb:
    name: X11 GUI live Xvfb qualification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Ensure Xvfb, xdotool, and xwd are installed
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-apps xdotool
      - name: Launch holonomy-gui on Xvfb and verify framebuffer + persisted container
        run: |
          set -o pipefail
          scripts/qualify-x11-gui.sh 2>&1 | tee "$RUNNER_TEMP/xvfb.log"
          grep 'HOLONOMY_XVFB_CAPTURE' "$RUNNER_TEMP/xvfb.log" > "$RUNNER_TEMP/xvfb.txt"
      - name: Record Xvfb GUI evidence in the audit issue
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/arena/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          { echo '### X11 GUI live Xvfb qualification'; echo '```text'; cat "$RUNNER_TEMP/xvfb.txt"; echo '```'; } \
            > "$RUNNER_TEMP/xvfb-comment.md"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/51/comments" -F "body=@$RUNNER_TEMP/xvfb-comment.md" --silent || echo "::warning::issue 51 comment failed"

  cross-os:
    name: cross-OS build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run clippy, workspace tests, and release build
        shell: bash
        run: |
          set +e
          {
            echo "=== cross-os clippy (${{ matrix.os }}) ==="
            cargo clippy --locked --workspace --all-targets -- -D warnings 2>&1
            CLIPPY_RC=${PIPESTATUS[0]}
            echo "clippy_rc=$CLIPPY_RC"
            if [ "$CLIPPY_RC" -eq 0 ]; then
              echo "=== cross-os test (${{ matrix.os }}) ==="
              cargo test --locked --workspace 2>&1
              TEST_RC=${PIPESTATUS[0]}
            else
              TEST_RC=1
            fi
            echo "test_rc=$TEST_RC"
            if [ "$CLIPPY_RC" -eq 0 ] && [ "$TEST_RC" -eq 0 ]; then
              echo "=== cross-os release build (${{ matrix.os }}) ==="
              cargo build --locked --release -p holonomy-gui --bin holonomy --bin holonomy-gui 2>&1
              BUILD_RC=${PIPESTATUS[0]}
            else
              BUILD_RC=1
            fi
            echo "build_rc=$BUILD_RC"
            exit $(( CLIPPY_RC || TEST_RC || BUILD_RC ))
          } | tee "$RUNNER_TEMP/cross-os.log"
          exit ${PIPESTATUS[0]}
      - name: Report cross-OS failure diagnostics to issue 51
        if: failure() && github.event_name == 'push' && startsWith(github.ref, 'refs/heads/arena/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          {
            echo "### cross-os failure (${{ matrix.os }})"
            echo '```text'
            tail -c 24000 "$RUNNER_TEMP/cross-os.log" || true
            echo '```'
          } > "$RUNNER_TEMP/cross-os-err.md"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/51/comments" -F "body=@$RUNNER_TEMP/cross-os-err.md" --silent || echo "::warning::issue 51 comment failed"

  sync:
    name: L-10 rsync transfer measurement
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Ensure rsync is installed
        run: |
          if ! command -v rsync >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y rsync
          fi
      - name: Measure a 30-million-word append through rsync over TCP
        run: |
          set -o pipefail
          cargo test --locked -p holonomy-line --lib tests::rsync_measures_append_transfer_over_a_named_local_daemon -- --exact --ignored --nocapture 2>&1 | tee "$RUNNER_TEMP/rsync-qualification.log"
          grep 'HOLONOMY_RSYNC_MEASUREMENT' "$RUNNER_TEMP/rsync-qualification.log" > "$RUNNER_TEMP/rsync-measurement.txt"
      - name: Record measured rsync transfer in the audit issue
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/arena/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          { echo '### L-10 rsync application-layer measurement'; echo '```text'; cat "$RUNNER_TEMP/rsync-measurement.txt"; echo '```'; } > "$RUNNER_TEMP/rsync-comment.md"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/51/comments" -F "body=@$RUNNER_TEMP/rsync-comment.md" --silent || echo "::warning::issue 51 comment failed"

  filesystem:
    name: L-6 ext4 ENOSPC rehearsal (not power-loss qualification)
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Ensure ext4 tools are installed
        run: |
          if ! command -v mkfs.ext4 >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y e2fsprogs
          fi
      - name: Run append and recovery on a 128 MiB ext4 loop filesystem
        run: |
          set -o pipefail
          scripts/qualify-ext4-enospc.sh 2>&1 | tee "$RUNNER_TEMP/ext4-enospc.log"
          grep -E 'HOLONOMY_EXT4_|HOLONOMY_ENOSPC_MEASUREMENT' "$RUNNER_TEMP/ext4-enospc.log" > "$RUNNER_TEMP/ext4-enospc-measurement.txt"
      - name: Record ext4 ENOSPC evidence and limitation in the audit issue
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/arena/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          { echo '### L-6 ext4 loop-filesystem ENOSPC evidence (not a device power-cut test)'; echo '```text'; cat "$RUNNER_TEMP/ext4-enospc-measurement.txt"; echo '```'; } > "$RUNNER_TEMP/ext4-enospc-comment.md"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/51/comments" -F "body=@$RUNNER_TEMP/ext4-enospc-comment.md" --silent || echo "::warning::issue 51 comment failed"

  smoke:
    name: M8 smoke — the shipped binary through a real terminal
    runs-on: ubuntu-latest
    # A smoke test that hangs is worse than one that fails: the first run of this job sat for 25
    # minutes because the pty driver could not deliver Ctrl+Q. The cap turns a hang into a failure.
    timeout-minutes: 10
    # Push-only, like the other jobs that need a terminal or a loop device: pull-request runs from
    # forks get no secrets and the evidence is posted back to the diag issue, which needs write.
    if: github.event_name == 'push'
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The pty comes from `scripts/drive-pty.py`, not from `script(1)`. `script` was the first
      # attempt and it hangs: it cannot reliably feed a pty non-interactively, so a program that
      # reads one byte at a time sees end-of-input before the piped bytes are readable and then
      # waits on a terminal nobody is typing into — this job sat for 25 minutes on its first run.
      # A pty the driver owns, with a deadline and a kill, has no such ambiguity.
      - name: Ensure python3 is available for the pty driver
        run: |
          if ! command -v python3 >/dev/null 2>&1; then
            echo "no python3: cannot drive a pty" >&2; exit 1
          fi
          python3 --version
      - name: Build the binary the way a user would
        run: cargo build --locked --release -p holonomy-gui --bin holonomy
      - name: Drive it — create, reopen, refuse wrong and empty passphrases
        run: |
          set -o pipefail
          HOLONOMY_BINARY="$(pwd)/target/release/holonomy" \
            scripts/smoke-install.sh 2>&1 | tee "$RUNNER_TEMP/smoke.log"
          grep 'HOLONOMY_SMOKE' "$RUNNER_TEMP/smoke.log"
      - name: Kill the shipped binary after a commit and recover the committed text
        # SIGKILL after a witnessed save, three delays. This is process-death evidence only:
        # it is not the physical power-cut qualification that keeps L-6 `spec`.
        run: |
          set -o pipefail
          HOLONOMY_BINARY="$(pwd)/target/release/holonomy" \
            scripts/qualify-crash-recovery.sh 2>&1 | tee "$RUNNER_TEMP/crash.log"
          grep 'HOLONOMY_CRASH_RECOVERY' "$RUNNER_TEMP/crash.log"
      - name: Record the smoke evidence in the audit issue
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/arena/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          { echo '### M8 smoke — the shipped binary through a real terminal'; echo '```text'; \
            grep -E 'HOLONOMY_SMOKE|^smoke: ' "$RUNNER_TEMP/smoke.log"; \
            grep -E 'HOLONOMY_CRASH_RECOVERY|^crash: ' "$RUNNER_TEMP/crash.log"; echo '```'; } \
            > "$RUNNER_TEMP/smoke-comment.md"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/51/comments" -F "body=@$RUNNER_TEMP/smoke-comment.md" --silent || echo "::warning::issue 51 comment failed"

  portability:
    name: L-9 hand-off drill (process half, not the second machine)
    runs-on: ubuntu-latest
    # Same shape as the smoke job and for the same reason: a pty that hangs is worse than one that
    # fails. Push-only, because the evidence is posted back to the diag issue.
    timeout-minutes: 10
    if: github.event_name == 'push'
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the binary the release would ship
        run: cargo build --locked --release -p holonomy-gui --bin holonomy
      # The drill authors a document, copies only the file to a delivered tree, then imports it in a
      # second process with a scrubbed environment and a state directory that must be empty before
      # and after. It prints `L-9=partial`, and the script says why in its own header.
      - name: Copy a document and import it with no inherited state
        run: |
          set -o pipefail
          HOLONOMY_BINARY="$(pwd)/target/release/holonomy" \
            scripts/qualify-l9-portability.sh 2>&1 | tee "$RUNNER_TEMP/l9.log"
          grep 'HOLONOMY_PORTABILITY' "$RUNNER_TEMP/l9.log"
      - name: Seed Linux x86_64 multi-script .wavefunction hand-off artifact
        run: |
          mkdir -p "$RUNNER_TEMP/l9-handoff"
          printf '%s\n' \
            'Holonomy v6 L-9 cross-architecture hand-off document.' \
            'Scripts: Français café, 日本語テスト, العربية النص, 🦀.' \
            'Verified with passphrase alone across Linux, macOS, and Windows.' \
            > "$RUNNER_TEMP/l9-handoff/handoff.expected.txt"
          printf '%s\n' "cross-os-l9-passphrase" | target/release/holonomy import --format plain \
            "$RUNNER_TEMP/l9-handoff/handoff.expected.txt" \
            "$RUNNER_TEMP/l9-handoff/handoff.wavefunction"
          printf '%s\n' "cross-os-l9-passphrase" | target/release/holonomy verify \
            "$RUNNER_TEMP/l9-handoff/handoff.wavefunction"
      - uses: actions/upload-artifact@v4
        with:
          name: l9-linux-handoff
          path: ${{ runner.temp }}/l9-handoff
          retention-days: 1
      - name: Record the portability evidence in the audit issue
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/arena/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          { echo '### L-9 hand-off drill — Linux zero-state & artifact seed'; echo '```text'; \
            grep -E 'HOLONOMY_PORTABILITY|^l9: ' "$RUNNER_TEMP/l9.log"; echo '```'; } \
            > "$RUNNER_TEMP/l9-comment.md"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/51/comments" -F "body=@$RUNNER_TEMP/l9-comment.md" --silent || echo "::warning::issue 51 comment failed"

  l9-cross-os:
    name: L-9 cross-OS hand-off (Linux -> ${{ matrix.os }})
    needs: [portability]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    if: github.event_name == 'push'
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          name: l9-linux-handoff
          path: l9-handoff
      - name: Build release binary on ${{ matrix.os }}
        shell: bash
        run: cargo build --locked --release -p holonomy-gui --bin holonomy
      - name: Verify and export Linux .wavefunction in isolated profile with passphrase alone
        shell: bash
        run: |
          set -euo pipefail
          BIN="target/release/holonomy"
          if [ -f "target/release/holonomy.exe" ]; then
            BIN="target/release/holonomy.exe"
          fi
          WORK="$(mktemp -d)"
          FRESH="$WORK/empty-profile"
          mkdir -p "$FRESH"
          if [ "$(uname -s)" = "Darwin" ]; then
            printf '%s\n' "cross-os-l9-passphrase" | env -i PATH="$PATH" HOME="$FRESH" \
              XDG_CONFIG_HOME="$FRESH/cfg" XDG_DATA_HOME="$FRESH/data" \
              XDG_CACHE_HOME="$FRESH/cache" XDG_STATE_HOME="$FRESH/state" \
              TMPDIR="$WORK" "$BIN" verify l9-handoff/handoff.wavefunction
            printf '%s\n' "cross-os-l9-passphrase" | env -i PATH="$PATH" HOME="$FRESH" \
              XDG_CONFIG_HOME="$FRESH/cfg" XDG_DATA_HOME="$FRESH/data" \
              XDG_CACHE_HOME="$FRESH/cache" XDG_STATE_HOME="$FRESH/state" \
              TMPDIR="$WORK" "$BIN" export --force --format plain \
              l9-handoff/handoff.wavefunction "$WORK/exported.txt"
          else
            WIN_FRESH="$(cygpath -w "$FRESH")"
            WIN_WORK="$(cygpath -w "$WORK")"
            printf '%s\n' "cross-os-l9-passphrase" | env -i PATH="$PATH" \
              SystemRoot="${SystemRoot:-${SYSTEMROOT:-C:\\Windows}}" \
              SYSTEMROOT="${SYSTEMROOT:-${SystemRoot:-C:\\Windows}}" \
              WINDIR="${WINDIR:-C:\\Windows}" \
              USERPROFILE="$WIN_FRESH" HOME="$WIN_FRESH" \
              LOCALAPPDATA="$WIN_FRESH\\local" APPDATA="$WIN_FRESH\\roaming" \
              TMP="$WIN_WORK" TEMP="$WIN_WORK" \
              "$BIN" verify l9-handoff/handoff.wavefunction
            printf '%s\n' "cross-os-l9-passphrase" | env -i PATH="$PATH" \
              SystemRoot="${SystemRoot:-${SYSTEMROOT:-C:\\Windows}}" \
              SYSTEMROOT="${SYSTEMROOT:-${SystemRoot:-C:\\Windows}}" \
              WINDIR="${WINDIR:-C:\\Windows}" \
              USERPROFILE="$WIN_FRESH" HOME="$WIN_FRESH" \
              LOCALAPPDATA="$WIN_FRESH\\local" APPDATA="$WIN_FRESH\\roaming" \
              TMP="$WIN_WORK" TEMP="$WIN_WORK" \
              "$BIN" export --force --format plain \
              l9-handoff/handoff.wavefunction "$WIN_WORK\\exported.txt"
          fi
          cmp -s l9-handoff/handoff.expected.txt "$WORK/exported.txt"
          if find "$FRESH" -type f | grep -q .; then
            echo "l9-cross-os: FAIL — binary created unexpected state in $FRESH" >&2
            exit 1
          fi
          echo "HOLONOMY_L9_CROSS_OS source=ubuntu-latest target=${{ matrix.os }} verified=true byte_identical=true profile_clean=true" \
            | tee "$RUNNER_TEMP/l9-cross-os.txt"
          rm -rf "$WORK"
      - name: Record cross-OS L-9 hand-off evidence in issue 51
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/arena/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          { echo "### L-9 cross-OS hand-off (Linux -> ${{ matrix.os }})"; echo '```text'; \
            cat "$RUNNER_TEMP/l9-cross-os.txt"; echo '```'; } > "$RUNNER_TEMP/l9-cross-os-comment.md"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/51/comments" -F "body=@$RUNNER_TEMP/l9-cross-os-comment.md" --silent || echo "::warning::issue 51 comment failed"

  lifecycle:
    name: Block 10 24-year fresh-user lifecycle drill
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'push'
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --locked --release -p holonomy-gui --bin holonomy
      - name: Run 24-year fresh-user install -> backup -> wipe -> restore -> continue drill
        run: |
          set -o pipefail
          HOLONOMY_BINARY="$(pwd)/target/release/holonomy" \
            scripts/qualify-24yr-lifecycle.sh 2>&1 | tee "$RUNNER_TEMP/lifecycle.log"
          grep -E 'HOLONOMY_24YR_(CLI_DRILL|LIFECYCLE)' "$RUNNER_TEMP/lifecycle.log" > "$RUNNER_TEMP/lifecycle.txt"
      - name: Record 24-year lifecycle drill in issue 51
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/arena/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          { echo '### Block 10 24-year fresh-user lifecycle drill'; echo '```text'; \
            cat "$RUNNER_TEMP/lifecycle.txt"; echo '```'; } > "$RUNNER_TEMP/lifecycle-comment.md"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/51/comments" -F "body=@$RUNNER_TEMP/lifecycle-comment.md" --silent || echo "::warning::issue 51 comment failed"

  gates:
    name: gates contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The human-readable contract must be byte-fresh from the law table in code.
      - run: cargo run --locked -p xtask -- gates --check
      # The gate machinery itself is tested: allocator counting, laws, timing.
      - run: cargo test --locked -p holonomy-ledger --release
