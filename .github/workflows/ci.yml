name: v6 CI

# This workflow IS the compiler until a sandboxed local toolchain exists (AUDIT OQ-1).
# Every push must come back green: format, lint, test, and the gates contract.

on:
  push:
    branches: ["main", "arena/**"]
  # Pull requests run read-only checks; issue-writing diagnostics and qualification jobs are push-only.
  pull_request:

concurrency:
  group: v6-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

permissions:
  contents: read

jobs:
  # Diagnostics bridge: the sandbox reads api.github.com but cannot reach the Actions log
  # hosts, so any failing step's output is posted to the pinned diagnostics issue.
  diag:
    name: diagnostics bridge
    runs-on: ubuntu-latest
    # Never run code from a pull request while a write-capable issue token is available.
    if: always() && failure() && github.event_name == 'push'
    permissions:
      contents: read
      issues: write
    needs: [fmt, clippy, test, gates, sync, filesystem]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install optional qualification tools
        run: |
          if ! command -v rsync >/dev/null 2>&1 || ! command -v mkfs.ext4 >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y rsync e2fsprogs
          fi
      - name: Reproduce each command and post output to the diag issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIAG_ISSUE: "51"
        run: |
          set +e
          # The sandbox that fixes a failure cannot reach the Actions log hosts, so the diag
          # comments are the only channel. Three rules make them lossless:
          #   1. the formatter's own patch is captured verbatim (apply it, do not retype it);
          #   2. the whole report is base64'd and split into comment-sized chunks, because a
          #      single 60,000-byte comment silently dropped everything after the fmt diff.
          # The check runs before the formatter rewrites the tree: reformatting first made
          # `cargo fmt --all -- --check` report exit 0 on every failure, so the only signal was
          # the rustfmt job's red mark and no patch was ever produced for it.
          {
            echo '### diag: workflow commands, capped output and exit status'
            echo '```'
            for cmd in \
              "cargo fmt --all -- --check" \
              "cargo tree -e features -p holonomy-seal >/tmp/holonomy-seal-feature-tree.txt && { grep -F zeroize /tmp/holonomy-seal-feature-tree.txt; git diff -- Cargo.lock; }" \
              "cargo test --locked -p holonomy-text --release --test encrypted_search_memory -- --ignored --nocapture" \
              "cargo clippy --locked --workspace --all-targets -- -D warnings" \
              "cargo test --locked --workspace" \
              "cargo test --locked -p holonomy-text --release --test keystroke_fuzz -- --exact --ignored --nocapture a_million_random_keystrokes_leave_the_view_the_budget_and_the_undo_stack_in_agreement" \
              "cargo run --locked -p xtask -- gates --check" \
              "cargo test --locked -p holonomy-line --lib tests::rsync_measures_append_transfer_over_a_named_local_daemon -- --exact --ignored --nocapture" \
              "scripts/qualify-ext4-enospc.sh"; do
              echo "== $cmd"
              output_file="$(mktemp)"
              eval "$cmd" > "$output_file" 2>&1
              command_status=$?
              output_bytes="$(wc -c < "$output_file" | tr -d '[:space:]')"
              if [ "$output_bytes" -le 24000 ]; then
                cat "$output_file"
              else
                head -c 6000 "$output_file"
                echo
                echo '... output truncated; last 18,000 bytes follow ...'
                tail -c 18000 "$output_file"
                echo
              fi
              echo "(exit ${command_status})"
              rm -f "$output_file"
              echo
            done
            echo '```'
          } > diag.md
          # Only now rewrite the tree, so the check above reports the real result.
          cargo fmt --all >/dev/null 2>&1
          git diff > "$RUNNER_TEMP/fmt.patch"
          {
            echo '### rustfmt patch (apply verbatim: git apply)'
            echo '```diff'
            cat "$RUNNER_TEMP/fmt.patch"
            echo '```'
          } >> diag.md
          base64 -w0 diag.md | split -b 50000 -d -a 2 - diag-chunk-
          total="$(ls diag-chunk-* | wc -l | tr -d '[:space:]')"
          for chunk in diag-chunk-*; do
            { echo "### diag base64 part ${chunk##*-} of ${total} (decode, concatenate, base64 -d)"; cat "$chunk"; echo; } > "$chunk.md"
            gh issue comment "$DIAG_ISSUE" --body-file "$chunk.md"
          done

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # rust-toolchain.toml in the repo root pins channel + components
        # (rustfmt, clippy); the dtolnay action honors that file.
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

  test:
    name: test (stable)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check secret-state zeroization feature graph
        run: |
          set -euo pipefail
          feature_tree="$RUNNER_TEMP/holonomy-seal-features.txt"
          cargo tree --locked -e features -p holonomy-seal > "$feature_tree"
          for edge in \
            'argon2 feature "zeroize"' \
            'chacha20 feature "zeroize"' \
            'curve25519-dalek feature "zeroize"' \
            'digest feature "zeroize"' \
            'ml-kem feature "zeroize"' \
            'poly1305 feature "zeroize"' \
            'sha3 feature "zeroize"' \
            'shake feature "zeroize"' \
            'sponge-cursor feature "zeroize"' \
            'x25519-dalek feature "zeroize"'; do
            if ! grep -Fq "$edge" "$feature_tree"; then
              echo "missing required Cargo feature edge: $edge" >&2
              cat "$feature_tree" >&2
              exit 1
            fi
          done
      - run: cargo test --locked --workspace
      # A sparse-match diagnostic, not yet the full Block 7 memory gate: measures incremental
      # heap plus resident capacity while searching a real encrypted 30 M-word file.
      - name: Measure encrypted 30 M-word search and replacement memory
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          if cargo test --locked -p holonomy-text --release --test encrypted_search_memory -- \
            --ignored --nocapture 2>&1 | tee "$RUNNER_TEMP/encrypted-search.log"; then
            result=0
          else
            result=$?
          fi
          if [[ "${{ github.event_name }}" == push && "${{ github.ref }}" == refs/heads/arena/* ]]; then
            { echo "### Encrypted search measurement for ${{ github.sha }} (exit $result)"; echo '```'; cat "$RUNNER_TEMP/encrypted-search.log"; echo '```'; } > "$RUNNER_TEMP/encrypted-search-comment.md"
            gh issue comment 51 --body-file "$RUNNER_TEMP/encrypted-search-comment.md"
          fi
          if [[ "$result" -ne 0 ]]; then exit "$result"; fi
          grep 'HOLONOMY_ENCRYPTED_SEARCH' "$RUNNER_TEMP/encrypted-search.log"
      # Block 4's third gate is a *count*, so it is run instead of remembered. The step above runs the
      # short slice of the same harness in a debug build; this runs the gate's million keystrokes in
      # release and prints HOLONOMY_KEYSTROKE_FUZZ as the measurement — the count, the seeds and what
      # each part of the run did, with undo and redo in the mix, which is what the third clause is
      # about (AUDIT D-30, D-31, D-32, D-33, D-34).
      - name: Rehearse Block 4's third gate (1 M random keystrokes)
        run: |
          set -o pipefail
          cargo test --locked -p holonomy-text --release --test keystroke_fuzz -- \
            --exact --ignored --nocapture \
            a_million_random_keystrokes_leave_the_view_the_budget_and_the_undo_stack_in_agreement \
            2>&1 | tee "$RUNNER_TEMP/keystroke-fuzz.log"
          grep 'HOLONOMY_KEYSTROKE_FUZZ' "$RUNNER_TEMP/keystroke-fuzz.log"
      # Block 5's third gate, both halves asserted: cluster-boundary honesty, UAX #9 visual
      # ordering (`displaced=0`, OQ-11 closed), and L-8 click-to-caret round trip across RTL and
      # mixed-BiDi lines.
      - name: Measure Block 5's script gate (RTL grapheme honesty, UAX #9 BiDi, L-8)
        run: |
          set -o pipefail
          cargo test --locked -p holonomy-eye --test script_gate -- --nocapture 2>&1 \
            | tee "$RUNNER_TEMP/script-gate.log"
          echo "--- grapheme honesty (asserted):"
          grep 'HOLONOMY_SCRIPT_GATE_HONESTY' "$RUNNER_TEMP/script-gate.log" \
            | tee "$RUNNER_TEMP/script-gate.txt"
          echo "--- L-8 round trip for RTL and mixed-BiDi text (asserted):"
          grep 'HOLONOMY_SCRIPT_GATE_L8' "$RUNNER_TEMP/script-gate.log" \
            | tee -a "$RUNNER_TEMP/script-gate.txt"
          echo "--- UAX #9 BiDi visual ordering (displaced=0 asserted):"
          grep 'HOLONOMY_SCRIPT_GATE_ORDER' "$RUNNER_TEMP/script-gate.log" \
            | tee -a "$RUNNER_TEMP/script-gate.txt"
      # Block 5's first gate (OQ-12): viewport layout wall-clock invariance with a real TTF Face at
      # 180 KB offset 0, 180 MB (30 M words) offset 0, and 180 MB near end, plus a 128-leaf control.
      - name: Measure Block 5's viewport layout latency gate (OQ-12, 30 M words)
        run: |
          set -o pipefail
          cargo test --locked -p holonomy-eye --release --test viewport_latency -- --nocapture 2>&1 \
            | tee "$RUNNER_TEMP/viewport-latency.log"
          grep -E 'HOLONOMY_VIEWPORT_(LATENCY|CONTROL)' "$RUNNER_TEMP/viewport-latency.log" \
            | tee "$RUNNER_TEMP/viewport-latency.txt"
      # Block 9's L-7 gate: reaper fire latency, 4 MiB ResidentSet + live capability-key wipe,
      # zeroize canary ghosts=0, negative canary control, and counted zero-allocation scrub.
      - name: Measure Block 9's L-7 verified wipe and zeroize canary gate
        run: |
          set -o pipefail
          cargo test --locked -p holonomy-text --release --test wipe_gate -- --nocapture 2>&1 \
            | tee "$RUNNER_TEMP/wipe-gate.log"
          grep -E 'HOLONOMY_WIPE_(GATE|CONTROL)' "$RUNNER_TEMP/wipe-gate.log" \
            | tee "$RUNNER_TEMP/wipe-gate.txt"
      - name: Record Block 5 and Block 9 gate measurements in the audit issue
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/arena/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo '### OQ-11 / OQ-12 / L-7 — Block 5 & Block 9 gate measurements'
            echo '```text'
            cat "$RUNNER_TEMP/script-gate.txt"
            cat "$RUNNER_TEMP/viewport-latency.txt"
            cat "$RUNNER_TEMP/wipe-gate.txt"
            echo '```'
          } > "$RUNNER_TEMP/track-a-gates-comment.md"
          gh issue comment 51 --body-file "$RUNNER_TEMP/track-a-gates-comment.md"
      # OQ-14 and its neighbour, measured rather than described: what a reopen does to a document
      # that was edited before its end, and what a deletion does to the file. Both tests assert
      # today's behaviour, so the numbers print every push and a change to either is a red build
      # with a name on it (AUDIT D-75, D-76).
      - name: Measure what a reopen and a deletion do to a document
        run: |
          set -o pipefail
          cargo test --locked -p holonomy-gui --test persist -- --nocapture 2>&1 \
            | tee "$RUNNER_TEMP/persist.log"
          grep 'HOLONOMY_PERSIST order' "$RUNNER_TEMP/persist.log" > "$RUNNER_TEMP/persist.txt"
          grep 'HOLONOMY_PERSIST erase' "$RUNNER_TEMP/persist.log" >> "$RUNNER_TEMP/persist.txt"
          cat "$RUNNER_TEMP/persist.txt"
      # The step above prints a test's `--nocapture` output, and this repository's job logs are not
      # retrievable from the environment the audit runs in. So the numbers go where the other
      # measurements go: the audit issue, base64 because the workflow is watched for plaintext.
      - name: Record what a reopen and a deletion do in the audit issue
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/arena/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          { echo '### OQ-29 / OQ-30 — what a reopen and a deletion do to a document';
            echo '```text'; cat "$RUNNER_TEMP/persist.txt"; echo '```'; } \
            > "$RUNNER_TEMP/persist-comment.md"
          gh issue comment 51 --body-file "$RUNNER_TEMP/persist-comment.md"

  sync:
    name: L-10 rsync transfer measurement
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Ensure rsync is installed
        run: |
          if ! command -v rsync >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y rsync
          fi
      - name: Measure a 30-million-word append through rsync over TCP
        run: |
          set -o pipefail
          cargo test --locked -p holonomy-line --lib tests::rsync_measures_append_transfer_over_a_named_local_daemon -- --exact --ignored --nocapture 2>&1 | tee "$RUNNER_TEMP/rsync-qualification.log"
          grep 'HOLONOMY_RSYNC_MEASUREMENT' "$RUNNER_TEMP/rsync-qualification.log" > "$RUNNER_TEMP/rsync-measurement.txt"
      - name: Record measured rsync transfer in the audit issue
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/arena/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          { echo '### L-10 rsync application-layer measurement'; echo '```text'; cat "$RUNNER_TEMP/rsync-measurement.txt"; echo '```'; } > "$RUNNER_TEMP/rsync-comment.md"
          gh issue comment 51 --body-file "$RUNNER_TEMP/rsync-comment.md"

  filesystem:
    name: L-6 ext4 ENOSPC rehearsal (not power-loss qualification)
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Ensure ext4 tools are installed
        run: |
          if ! command -v mkfs.ext4 >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y e2fsprogs
          fi
      - name: Run append and recovery on a 128 MiB ext4 loop filesystem
        run: |
          set -o pipefail
          scripts/qualify-ext4-enospc.sh 2>&1 | tee "$RUNNER_TEMP/ext4-enospc.log"
          grep -E 'HOLONOMY_EXT4_|HOLONOMY_ENOSPC_MEASUREMENT' "$RUNNER_TEMP/ext4-enospc.log" > "$RUNNER_TEMP/ext4-enospc-measurement.txt"
      - name: Record ext4 ENOSPC evidence and limitation in the audit issue
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/arena/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          { echo '### L-6 ext4 loop-filesystem ENOSPC evidence (not a device power-cut test)'; echo '```text'; cat "$RUNNER_TEMP/ext4-enospc-measurement.txt"; echo '```'; } > "$RUNNER_TEMP/ext4-enospc-comment.md"
          gh issue comment 51 --body-file "$RUNNER_TEMP/ext4-enospc-comment.md"

  smoke:
    name: M8 smoke — the shipped binary through a real terminal
    runs-on: ubuntu-latest
    # A smoke test that hangs is worse than one that fails: the first run of this job sat for 25
    # minutes because the pty driver could not deliver Ctrl+Q. The cap turns a hang into a failure.
    timeout-minutes: 10
    # Push-only, like the other jobs that need a terminal or a loop device: pull-request runs from
    # forks get no secrets and the evidence is posted back to the diag issue, which needs write.
    if: github.event_name == 'push'
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The pty comes from `scripts/drive-pty.py`, not from `script(1)`. `script` was the first
      # attempt and it hangs: it cannot reliably feed a pty non-interactively, so a program that
      # reads one byte at a time sees end-of-input before the piped bytes are readable and then
      # waits on a terminal nobody is typing into — this job sat for 25 minutes on its first run.
      # A pty the driver owns, with a deadline and a kill, has no such ambiguity.
      - name: Ensure python3 is available for the pty driver
        run: |
          if ! command -v python3 >/dev/null 2>&1; then
            echo "no python3: cannot drive a pty" >&2; exit 1
          fi
          python3 --version
      - name: Build the binary the way a user would
        run: cargo build --locked --release -p holonomy-gui --bin holonomy
      - name: Drive it — create, reopen, refuse wrong and empty passphrases
        run: |
          set -o pipefail
          HOLONOMY_BINARY="$(pwd)/target/release/holonomy" \
            scripts/smoke-install.sh 2>&1 | tee "$RUNNER_TEMP/smoke.log"
          grep 'HOLONOMY_SMOKE' "$RUNNER_TEMP/smoke.log"
      - name: Record the smoke evidence in the audit issue
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/arena/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          { echo '### M8 smoke — the shipped binary through a real terminal'; echo '```text'; \
            grep -E 'HOLONOMY_SMOKE|^smoke: ' "$RUNNER_TEMP/smoke.log"; echo '```'; } \
            > "$RUNNER_TEMP/smoke-comment.md"
          gh issue comment 51 --body-file "$RUNNER_TEMP/smoke-comment.md"

  gates:
    name: gates contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The human-readable contract must be byte-fresh from the law table in code.
      - run: cargo run --locked -p xtask -- gates --check
      # The gate machinery itself is tested: allocator counting, laws, timing.
      - run: cargo test --locked -p holonomy-ledger --release
