name: v6 CI

# This workflow IS the compiler until a sandboxed local toolchain exists (AUDIT OQ-1).
# Every push must come back green: format, lint, test, and the gates contract.

on:
  push:
    branches: ["main", "arena/**"]
  # Pull requests run read-only checks; issue-writing diagnostics and qualification jobs are push-only.
  pull_request:

concurrency:
  group: v6-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

permissions:
  contents: read

jobs:
  # Diagnostics bridge: the sandbox reads api.github.com but cannot reach the Actions log
  # hosts, so any failing step's output is posted to the pinned diagnostics issue.
  diag:
    name: diagnostics bridge
    runs-on: ubuntu-latest
    # Never run code from a pull request while a write-capable issue token is available.
    if: always() && failure() && github.event_name == 'push'
    permissions:
      contents: read
      issues: write
    needs: [fmt, clippy, test, gates, sync, filesystem]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install optional qualification tools
        run: |
          if ! command -v rsync >/dev/null 2>&1 || ! command -v mkfs.ext4 >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y rsync e2fsprogs
          fi
      - name: Reproduce each command and post output to the diag issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIAG_ISSUE: "51"
        run: |
          set +e
          {
            echo '### diag: workflow commands, capped output and exit status'
            echo '```'
            for cmd in \
              "cargo fmt --all -- --check" \
              "cargo clippy --locked --workspace --all-targets -- -D warnings" \
              "cargo test --locked --workspace" \
              "cargo run --locked -p xtask -- gates --check" \
              "cargo test --locked -p holonomy-line --lib tests::rsync_measures_append_transfer_over_a_named_local_daemon -- --exact --ignored --nocapture" \
              "scripts/qualify-ext4-enospc.sh"; do
              echo "== $cmd"
              output_file="$(mktemp)"
              eval "$cmd" > "$output_file" 2>&1
              command_status=$?
              output_bytes="$(wc -c < "$output_file" | tr -d '[:space:]')"
              if [ "$output_bytes" -le 8000 ]; then
                cat "$output_file"
              else
                head -c 2000 "$output_file"
                echo
                echo '... output truncated; last 6,000 bytes follow ...'
                tail -c 6000 "$output_file"
                echo
              fi
              echo "(exit ${command_status})"
              rm -f "$output_file"
              echo
            done
            echo '```'
          } > diag.md
          head -c 60000 diag.md > diag-trim.md
          gh issue comment "$DIAG_ISSUE" --body-file diag-trim.md

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # rust-toolchain.toml in the repo root pins channel + components
        # (rustfmt, clippy); the dtolnay action honors that file.
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

  test:
    name: test (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --workspace

  sync:
    name: L-10 rsync transfer measurement
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Ensure rsync is installed
        run: |
          if ! command -v rsync >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y rsync
          fi
      - name: Measure a 30-million-word append through rsync over TCP
        run: |
          set -o pipefail
          cargo test --locked -p holonomy-line --lib tests::rsync_measures_append_transfer_over_a_named_local_daemon -- --exact --ignored --nocapture 2>&1 | tee "$RUNNER_TEMP/rsync-qualification.log"
          grep 'HOLONOMY_RSYNC_MEASUREMENT' "$RUNNER_TEMP/rsync-qualification.log" > "$RUNNER_TEMP/rsync-measurement.txt"
      - name: Record measured rsync transfer in the audit issue
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/arena/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          { echo '### L-10 rsync application-layer measurement'; echo '```text'; cat "$RUNNER_TEMP/rsync-measurement.txt"; echo '```'; } > "$RUNNER_TEMP/rsync-comment.md"
          gh issue comment 51 --body-file "$RUNNER_TEMP/rsync-comment.md"

  filesystem:
    name: L-6 ext4 ENOSPC rehearsal (not power-loss qualification)
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Ensure ext4 tools are installed
        run: |
          if ! command -v mkfs.ext4 >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y e2fsprogs
          fi
      - name: Run append and recovery on a 128 MiB ext4 loop filesystem
        run: |
          set -o pipefail
          scripts/qualify-ext4-enospc.sh 2>&1 | tee "$RUNNER_TEMP/ext4-enospc.log"
          grep -E 'HOLONOMY_EXT4_|HOLONOMY_ENOSPC_MEASUREMENT' "$RUNNER_TEMP/ext4-enospc.log" > "$RUNNER_TEMP/ext4-enospc-measurement.txt"
      - name: Record ext4 ENOSPC evidence and limitation in the audit issue
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/arena/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          { echo '### L-6 ext4 loop-filesystem ENOSPC evidence (not a device power-cut test)'; echo '```text'; cat "$RUNNER_TEMP/ext4-enospc-measurement.txt"; echo '```'; } > "$RUNNER_TEMP/ext4-enospc-comment.md"
          gh issue comment 51 --body-file "$RUNNER_TEMP/ext4-enospc-comment.md"

  gates:
    name: gates contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The human-readable contract must be byte-fresh from the law table in code.
      - run: cargo run --locked -p xtask -- gates --check
      # The gate machinery itself is tested: allocator counting, laws, timing.
      - run: cargo test --locked -p holonomy-ledger --release
