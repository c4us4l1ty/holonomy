name: v6 release

# `docs/TO-APP.md` M8 release workflow, built honestly across all three desktop OSes.
#
#   * Builds `holonomy` (TUI + CLI) and `holonomy-gui` (pure-FFI X11 / Cocoa / Win32 desktop)
#     for Linux (`x86_64-unknown-linux-gnu`), macOS (`aarch64-apple-darwin`), and Windows
#     (`x86_64-pc-windows-msvc`) from the pinned toolchain and committed `Cargo.lock`.
#   * Runs `scripts/smoke-install.sh` against the compiled Linux release binary before packaging.
#   * Unsigned and unpublished-by-default: a `v*` tag publishes one GitHub Release containing all
#     three OS archives + SHA-256 + provenance; `workflow_dispatch` builds and uploads CI artifacts
#     without publishing.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-tarball:
    name: build, smoke and package (linux x86_64, unsigned)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Name the artifact
        id: name
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
          else
            version="$(git rev-parse --short=12 HEAD)"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "stem=holonomy-${version}-${TARGET}" >> "$GITHUB_OUTPUT"

      - name: Build Linux release binaries from the lockfile
        run: cargo build --locked --release -p holonomy-gui --bin holonomy --bin holonomy-gui

      - name: Smoke-test the release binary before packaging
        run: |
          set -o pipefail
          HOLONOMY_BINARY="$(pwd)/target/release/holonomy" \
            scripts/smoke-install.sh 2>&1 | tee "$RUNNER_TEMP/smoke.log"
          grep 'HOLONOMY_SMOKE' "$RUNNER_TEMP/smoke.log"

      - name: Assemble the Linux tarball
        env:
          STEM: ${{ steps.name.outputs.stem }}
        run: |
          set -euo pipefail
          root="target/package/${STEM}"
          mkdir -p "${root}/bin" "${root}/share/doc/holonomy/LICENSES"
          install -m 755 target/release/holonomy "${root}/bin/holonomy"
          install -m 755 target/release/holonomy-gui "${root}/bin/holonomy-gui"
          cp LICENSE-MIT LICENSE-APACHE THIRD_PARTY.md README.md "${root}/share/doc/holonomy/"
          cp LICENSES/*.txt "${root}/share/doc/holonomy/LICENSES/"
          cp packaging/README-RELEASE.txt "${root}/README-RELEASE.txt"
          tar --owner=0 --group=0 --numeric-owner --sort=name -C target/package \
            -czf "target/package/${STEM}.tar.gz" "${STEM}"
          (
            cd target/package
            sha256sum "${STEM}.tar.gz" > "${STEM}.tar.gz.sha256"
            {
              echo "artifact:  ${STEM}.tar.gz"
              echo "commit:    ${GITHUB_SHA}"
              echo "ref:       ${GITHUB_REF}"
              echo "target:    ${TARGET}"
              echo "toolchain: pinned by rust-toolchain.toml (channel 1.100.0)"
              echo "built:     $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              echo "smoke:     gated — scripts/smoke-install.sh ran before packaging"
              echo "signed:    no — unsigned experimental build"
            } > "${STEM}.provenance.txt"
          )

      - name: Upload Linux release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.stem }}
          path: |
            target/package/*.tar.gz
            target/package/*.sha256
            target/package/*.provenance.txt
          if-no-files-found: error
          retention-days: 90

  macos-tarball:
    name: build, test and package (macos aarch64, unsigned)
    runs-on: macos-latest
    timeout-minutes: 25
    env:
      TARGET: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Name the artifact
        id: name
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
          else
            version="$(git rev-parse --short=12 HEAD)"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "stem=holonomy-${version}-${TARGET}" >> "$GITHUB_OUTPUT"

      - name: Build and verify macOS workspace tests + binaries
        run: |
          cargo test --locked -p holonomy-gui
          cargo build --locked --release -p holonomy-gui --bin holonomy --bin holonomy-gui

      - name: Assemble the macOS tarball
        env:
          STEM: ${{ steps.name.outputs.stem }}
        run: |
          set -euo pipefail
          root="target/package/${STEM}"
          mkdir -p "${root}/bin" "${root}/share/doc/holonomy/LICENSES"
          install -m 755 target/release/holonomy "${root}/bin/holonomy"
          install -m 755 target/release/holonomy-gui "${root}/bin/holonomy-gui"
          cp LICENSE-MIT LICENSE-APACHE THIRD_PARTY.md README.md "${root}/share/doc/holonomy/"
          cp LICENSES/*.txt "${root}/share/doc/holonomy/LICENSES/"
          cp packaging/README-RELEASE.txt "${root}/README-RELEASE.txt"
          tar -C target/package -czf "target/package/${STEM}.tar.gz" "${STEM}"
          (
            cd target/package
            shasum -a 256 "${STEM}.tar.gz" > "${STEM}.tar.gz.sha256"
            {
              echo "artifact:  ${STEM}.tar.gz"
              echo "commit:    ${GITHUB_SHA}"
              echo "ref:       ${GITHUB_REF}"
              echo "target:    ${TARGET}"
              echo "toolchain: pinned by rust-toolchain.toml (channel 1.100.0)"
              echo "built:     $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              echo "tests:     cargo test --locked -p holonomy-gui passed"
              echo "signed:    no — unsigned experimental build (not notarized)"
            } > "${STEM}.provenance.txt"
          )

      - name: Upload macOS release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.stem }}
          path: |
            target/package/*.tar.gz
            target/package/*.sha256
            target/package/*.provenance.txt
          if-no-files-found: error
          retention-days: 90

  windows-zip:
    name: build, test and package (windows x86_64, unsigned)
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      TARGET: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Name the artifact
        id: name
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
          else
            version="$(git rev-parse --short=12 HEAD)"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "stem=holonomy-${version}-${TARGET}" >> "$GITHUB_OUTPUT"

      - name: Build and verify Windows workspace tests + binaries
        shell: bash
        run: |
          cargo test --locked -p holonomy-gui
          cargo build --locked --release -p holonomy-gui --bin holonomy --bin holonomy-gui

      - name: Assemble the Windows archive
        shell: pwsh
        env:
          STEM: ${{ steps.name.outputs.stem }}
        run: |
          $ErrorActionPreference = "Stop"
          $root = "target/package/$env:STEM"
          New-Item -ItemType Directory -Force -Path "$root/bin", "$root/share/doc/holonomy/LICENSES" | Out-Null
          Copy-Item target/release/holonomy.exe "$root/bin/holonomy.exe"
          Copy-Item target/release/holonomy-gui.exe "$root/bin/holonomy-gui.exe"
          Copy-Item LICENSE-MIT, LICENSE-APACHE, THIRD_PARTY.md, README.md "$root/share/doc/holonomy/"
          Copy-Item LICENSES/*.txt "$root/share/doc/holonomy/LICENSES/"
          Copy-Item packaging/README-RELEASE.txt "$root/README-RELEASE.txt"
          $zipPath = "target/package/$env:STEM.zip"
          Compress-Archive -Path $root -DestinationPath $zipPath -Force
          $hash = (Get-FileHash -Algorithm SHA256 $zipPath).Hash.ToLowerInvariant()
          "$hash  $env:STEM.zip" | Out-File -Encoding ascii "target/package/$env:STEM.zip.sha256"
          @(
            "artifact:  $env:STEM.zip"
            "commit:    $env:GITHUB_SHA"
            "ref:       $env:GITHUB_REF"
            "target:    $env:TARGET"
            "toolchain: pinned by rust-toolchain.toml (channel 1.100.0)"
            "built:     $((Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ'))"
            "tests:     cargo test --locked -p holonomy-gui passed"
            "signed:    no — unsigned experimental build"
          ) | Out-File -Encoding ascii "target/package/$env:STEM.provenance.txt"

      - name: Upload Windows release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.stem }}
          path: |
            target/package/*.zip
            target/package/*.sha256
            target/package/*.provenance.txt
          if-no-files-found: error
          retention-days: 90

  publish-release:
    name: publish GitHub release (tag pushes only, unsigned)
    needs: [linux-tarball, macos-tarball, windows-zip]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" \
              --title "holonomy ${GITHUB_REF_NAME} (unsigned, experimental)" \
              --notes "Unsigned experimental archives for Linux x86_64, macOS aarch64, and Windows x86_64 built from ${GITHUB_SHA}. Read README-RELEASE.txt inside the archive first: only L-1, L-2, and L-8 are gated in docs/GATES.md, and hardware power-loss / multi-machine / reference-hardware gates remain open."
          fi
          find dist -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.sha256' -o -name '*.provenance.txt' \) -print0 \
            | xargs -0 gh release upload "${GITHUB_REF_NAME}" --clobber
