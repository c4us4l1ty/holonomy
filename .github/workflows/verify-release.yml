name: Verify release and SVG boundary

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain and static target
        run: rustup toolchain install 1.98.1 --profile minimal --component clippy,rustfmt --target x86_64-unknown-linux-musl
      - name: Resolve new dependencies while preserving existing lockfile pins
        run: cargo fetch --target x86_64-unknown-linux-musl
      - name: Keep the resolved lockfile available if this gate fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-lockfile
          path: Cargo.lock
      # Some development sandboxes only reach api.github.com, not GitHub's blob storage for
      # Actions artifacts/logs. A compressed patch annotation can be retrieved via the Checks API.
      - name: Report the resolved lockfile patch through the Checks API
        if: always()
        run: |
          if ! git diff --quiet -- Cargo.lock; then
            git diff --binary -- Cargo.lock | gzip -c | base64 -w0 > /tmp/holonomy-lock-patch.txt
            # GitHub truncates a single check annotation at 4096 chars.
            split -b 3000 -d -a 3 /tmp/holonomy-lock-patch.txt /tmp/holonomy-lock-part-
            for part in /tmp/holonomy-lock-part-*; do
              echo "::warning title=Cargo.lock patch part ${part##*-}::$(cat "$part")"
            done
          fi
      - name: Check the sealed dependency boundary
        run: |
          mkdir -p target
          cargo tree -p holonomy --no-default-features --edges normal > target/sealed-tree.txt
          if grep -E '(^|[[:space:]])(resvg|usvg|roxmltree|png) v[0-9]' target/sealed-tree.txt; then
            echo 'An SVG/XML/PNG encoder dependency is linked into the sealed runtime' >&2
            exit 1
          fi
      - name: Renderer and desktop SVG integration tests
        run: |
          set -o pipefail
          if ! (cargo test --locked -p holonomy-render &&
                cargo test --locked -p holonomy-input &&
                cargo test --locked -p holonomy --features desktop --lib &&
                cargo test --locked -p holonomy --features desktop --test svg_import --test desktop_documents --test session_image --test pointer --test toolbar_wiring) 2>&1 | tee target/rust-check.log; then
            echo "::error title=Rust build or SVG test failure::$(tail -c 3800 target/rust-check.log | tr '\n' '|' | sed 's/%/%25/g;s/\r/%0D/g')"
            exit 1
          fi
      - name: Sealed, static release artifact and size gate
        if: always()
        run: |
          set -o pipefail
          if cargo test --locked -p holonomy --release --test release_artifact -- --nocapture 2>&1 | tee target/release-sealed.log; then
            echo "::notice title=Sealed release size::$(stat -c %s target/x86_64-unknown-linux-musl/release/holonomy) bytes (ceiling 4194304)"
          else
            echo "::error title=Sealed release gate::$(tail -c 3900 target/release-sealed.log | tr '\n' '|' | sed 's/%/%25/g;s/\r/%0D/g')"
            exit 1
          fi
      - name: Desktop, static release artifact and size gate
        if: always()
        run: |
          set -o pipefail
          if cargo test --locked -p holonomy --release --features desktop --test release_artifact -- --nocapture 2>&1 | tee target/release-desktop.log; then
            echo "::notice title=Desktop release size::$(stat -c %s target/x86_64-unknown-linux-musl/release/holonomy) bytes (ceiling 4194304)"
          else
            echo "::error title=Desktop release gate::$(tail -c 3900 target/release-desktop.log | tr '\n' '|' | sed 's/%/%25/g;s/\r/%0D/g')"
            exit 1
          fi
      - name: Recheck regressions from the full suite
        run: |
          set -o pipefail
          failed=0
          cargo test --no-fail-fast --locked -p holonomy --release --test armed_style --test decorations --test paragraph_formatting --test session --test session_latency --test zoom -- --test-threads=2 > target/regression-check.log 2>&1 || failed=1
          cargo test --no-fail-fast --locked -p holonomy-display --release --test chrome_paint_order --test paint_chrome -- --test-threads=2 >> target/regression-check.log 2>&1 || failed=1
          cargo test --no-fail-fast --locked -p holonomy-export --release --lib --test export -- --test-threads=2 >> target/regression-check.log 2>&1 || failed=1
          cargo test --no-fail-fast --locked -p holonomy-text --release --test format_history --test latency -- --test-threads=2 >> target/regression-check.log 2>&1 || failed=1
          if [ "$failed" -ne 0 ]; then
            echo "::error title=Regression failure index::$(grep -E '(^error\[|^error:|FAILED|panicked)' target/regression-check.log | tail -c 3800 | tr '\n' '|' | sed 's/%/%25/g;s/\r/%0D/g')"
            gzip -c target/regression-check.log | base64 -w0 > /tmp/holonomy-regression-log.b64
            split -b 3000 -d -a 3 /tmp/holonomy-regression-log.b64 /tmp/holonomy-regression-part-
            for part in /tmp/holonomy-regression-part-*; do
              echo "::warning title=Regression log part ${part##*-}::$(cat "$part")"
            done
            exit 1
          fi
      - name: Full workspace regression suite
        run: |
          set -o pipefail
          # Container gates use 128 MiB direct I/O and Argon2; two test threads keep
          # memory pressure bounded on hosted runners. Live X11 gates remain opt-in.
          if cargo test --no-fail-fast --locked --workspace --release -- --test-threads=2 2>&1 | tee target/workspace-check.log; then
            echo "::notice title=Full regression::Workspace release tests passed"
          else
            echo "::error title=Workspace failure index::$(grep -E '(^error\[|^error:|FAILED|panicked)' target/workspace-check.log | tail -c 3800 | tr '\n' '|' | sed 's/%/%25/g;s/\r/%0D/g')"
            echo "::error title=Full workspace test failure::$(tail -c 3900 target/workspace-check.log | tr '\n' '|' | sed 's/%/%25/g;s/\r/%0D/g')"
            gzip -c target/workspace-check.log | base64 -w0 > /tmp/holonomy-workspace-log.b64
            split -b 3000 -d -a 3 /tmp/holonomy-workspace-log.b64 /tmp/holonomy-workspace-part-
            for part in /tmp/holonomy-workspace-part-*; do
              echo "::warning title=Workspace log part ${part##*-}::$(cat "$part")"
            done
            exit 1
          fi
      - name: Report a formatting patch through the Checks API
        if: always()
        run: |
          set -o pipefail
          if ! cargo fmt --all 2>&1 | tee target/format.log; then
            echo "::error title=rustfmt error::$(tail -c 3800 target/format.log | tr '\n' '|' | sed 's/%/%25/g;s/\r/%0D/g')"
            exit 1
          fi
          if ! git diff --quiet -- . ':!Cargo.lock'; then
            git diff --binary -- . ':!Cargo.lock' | gzip -c | base64 -w0 > /tmp/holonomy-format-patch.txt
            split -b 3000 -d -a 3 /tmp/holonomy-format-patch.txt /tmp/holonomy-format-part-
            for part in /tmp/holonomy-format-part-*; do
              echo "::warning title=Formatting patch part ${part##*-}::$(cat "$part")"
            done
          fi
      - name: Formatting and committed dependency lockfile
        if: always()
        run: |
          git diff --exit-code -- Cargo.lock
          git diff --exit-code -- . ':!Cargo.lock'
