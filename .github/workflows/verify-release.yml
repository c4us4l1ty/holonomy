name: Verify release and SVG boundary

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain and static target
        run: rustup toolchain install 1.98.1 --profile minimal --component clippy,rustfmt --target x86_64-unknown-linux-musl
      - name: Resolve new dependencies while preserving existing lockfile pins
        run: cargo fetch --target x86_64-unknown-linux-musl
      - name: Keep the resolved lockfile available if this gate fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-lockfile
          path: Cargo.lock
      # Some development sandboxes only reach api.github.com, not GitHub's blob storage for
      # Actions artifacts/logs. A compressed patch annotation can be retrieved via the Checks API.
      - name: Report the resolved lockfile patch through the Checks API
        if: always()
        run: |
          if ! git diff --quiet -- Cargo.lock; then
            git diff --binary -- Cargo.lock | gzip -c | base64 -w0 > /tmp/holonomy-lock-patch.txt
            # GitHub truncates a single check annotation at 4096 chars.
            split -b 3000 -d -a 3 /tmp/holonomy-lock-patch.txt /tmp/holonomy-lock-part-
            for part in /tmp/holonomy-lock-part-*; do
              echo "::warning title=Cargo.lock patch part ${part##*-}::$(cat "$part")"
            done
          fi
      - name: Check the sealed dependency boundary
        run: |
          mkdir -p target
          cargo tree -p holonomy --no-default-features --edges normal > target/sealed-tree.txt
          if grep -E '(^|[[:space:]])(resvg|usvg|roxmltree|png) v[0-9]' target/sealed-tree.txt; then
            echo 'An SVG/XML/PNG encoder dependency is linked into the sealed runtime' >&2
            exit 1
          fi
      - name: Renderer and desktop SVG integration tests
        run: |
          set -o pipefail
          if ! (cargo test --locked -p holonomy-render &&
                cargo test --locked -p holonomy --features desktop --lib &&
                cargo test --locked -p holonomy --features desktop --test svg_import --test desktop_documents --test session_image) 2>&1 | tee target/rust-check.log; then
            echo "::error title=Rust build or SVG test failure::$(tail -c 12000 target/rust-check.log | tr '\n' '|' | sed 's/%/%25/g;s/\r/%0D/g')"
            exit 1
          fi
      - name: Sealed, static release artifact and size gate
        run: |
          set -o pipefail
          if cargo test --locked -p holonomy --release --test release_artifact -- --nocapture 2>&1 | tee target/release-sealed.log; then
            echo "::notice title=Sealed release size::$(stat -c %s target/x86_64-unknown-linux-musl/release/holonomy) bytes (ceiling 4194304)"
          else
            echo "::error title=Sealed release gate::$(tail -c 3900 target/release-sealed.log | tr '\n' '|' | sed 's/%/%25/g;s/\r/%0D/g')"
            exit 1
          fi
      - name: Desktop, static release artifact and size gate
        run: |
          set -o pipefail
          if cargo test --locked -p holonomy --release --features desktop --test release_artifact -- --nocapture 2>&1 | tee target/release-desktop.log; then
            echo "::notice title=Desktop release size::$(stat -c %s target/x86_64-unknown-linux-musl/release/holonomy) bytes (ceiling 4194304)"
          else
            echo "::error title=Desktop release gate::$(tail -c 3900 target/release-desktop.log | tr '\n' '|' | sed 's/%/%25/g;s/\r/%0D/g')"
            exit 1
          fi
      - name: Report a formatting patch through the Checks API
        if: always()
        run: |
          cargo fmt --all
          if ! git diff --quiet -- . ':!Cargo.lock'; then
            git diff --binary -- . ':!Cargo.lock' | gzip -c | base64 -w0 > /tmp/holonomy-format-patch.txt
            split -b 3000 -d -a 3 /tmp/holonomy-format-patch.txt /tmp/holonomy-format-part-
            for part in /tmp/holonomy-format-part-*; do
              echo "::warning title=Formatting patch part ${part##*-}::$(cat "$part")"
            done
          fi
      - name: Formatting and committed dependency lockfile
        if: always()
        run: |
          git diff --exit-code -- Cargo.lock
          git diff --exit-code -- . ':!Cargo.lock'
