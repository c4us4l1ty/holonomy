name: Verify Holonomy UI
on:
  push:
    branches: ['arena/ca2b02bd-holonomy']
# **TEMPORARY BRANCH SCAFFOLDING, deleted before this branch is proposed for main.**
# It publishes its own failure summary to the branch because this sandbox cannot read
# Actions logs or download artifacts (the blob host is unreachable), and a summarised
# log is the only channel by which a compile error or a failing assertion travels back.
permissions:
  contents: write
concurrency:
  group: verify-ca2b02bd
  cancel-in-progress: true
jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.98.1
          targets: x86_64-unknown-linux-musl
          components: rustfmt
      - uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
        with:
          shared-key: holonomy-musl-release
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Check sealed and desktop targets
        run: |-
          set -o pipefail
          cargo check --workspace --all-targets --message-format=short 2>&1 | tee /tmp/check.log
          cargo check --workspace --all-targets --features holonomy/desktop --message-format=short 2>&1 | tee -a /tmp/check.log
      - name: Release tests
        run: |-
          set -o pipefail
          cargo test --workspace --release --no-fail-fast -- --test-threads=1 2>&1 | tee /tmp/test.log
      - name: Desktop tests
        if: always()
        run: |-
          cargo test -p holonomy --features desktop --release --no-fail-fast -- --test-threads=2 2>&1 | tee -a /tmp/test.log
          cargo test -p holonomy-input --features desktop --release 2>&1 | tee -a /tmp/test.log
          cargo test -p holonomy-x11 --release 2>&1 | tee -a /tmp/test.log
          cargo test -p holonomy-display --features desktop --release 2>&1 | tee -a /tmp/test.log
      - name: Summarise
        if: always()
        run: |-
          {
            grep -a -E '^(error(\[E[0-9]+\])?: |test result: FAILED)' /tmp/test.log
            echo
            grep -a -E '^(test .*\.\.\. FAILED|---- .* stdout ----)' /tmp/test.log
            echo
            awk '/^---- .* stdout ----/ { p = 1 } /^(failures:|error)/ { p = 0 } p' /tmp/test.log
          } > ci-test.log || true
          tail -n 300 /tmp/check.log > ci-check.log || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: diagnostics
          path: |
            ci-test.log
            ci-check.log
          if-no-files-found: ignore
  # **The baseline, so "red" can be told apart from "newly red".** `main` carries its own
  # suites and gates; this branch is judged by the difference, not by an absolute zero
  # nobody has reached.
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.98.1
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
        with:
          shared-key: holonomy-musl-release
      - name: Release tests on main
        run: |-
          cargo test --workspace --release --no-fail-fast -- --test-threads=1 > /tmp/base.log 2>&1 || true
          cargo test -p holonomy --features desktop --release --no-fail-fast -- --test-threads=2 >> /tmp/base.log 2>&1 || true
          exit 0
      - name: Summarise
        if: always()
        run: |-
          {
            grep -a -E '^(error(\[E[0-9]+\])?: |test result: FAILED)' /tmp/base.log
            echo
            grep -a -E '^(test .*\.\.\. FAILED|---- .* stdout ----)' /tmp/base.log
            echo
            awk '/^---- .* stdout ----/ { p = 1 } /^(failures:|error)/ { p = 0 } p' /tmp/base.log
          } > ci-baseline.log || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: baseline
          path: ci-baseline.log
          if-no-files-found: ignore
  # **Publishing is its own job, on purpose.** It used to be a step inside each test job,
  # and two jobs in one run both pushing a rebased commit meant the loser's push was
  # rejected and its log never arrived -- twice, silently, once for the baseline that
  # exists precisely to say which failures are pre-existing. A single job, started after
  # both, fetches their artifacts and makes one commit per file.
  publish:
    needs: [rust, baseline]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: always()
        with:
          path: /tmp/logs
          merge-multiple: true
      - name: Publish logs
        run: |-
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/logs
          published=0
          for f in ci-test.log ci-check.log ci-baseline.log; do
            if [ -f "/tmp/logs/$f" ]; then
              cp "/tmp/logs/$f" "$f"
              git add -f "$f"
              git commit -m "ci: publish $f" || true
              published=1
            fi
          done
          if [ "$published" = 0 ]; then
            echo "no diagnostics were produced -- nothing to publish" >&2
            exit 0
          fi
          for attempt in 1 2 3 4 5; do
            git fetch -q origin arena/ca2b02bd-holonomy
            if git push -q origin HEAD:arena/ca2b02bd-holonomy; then
              exit 0
            fi
            git rebase -q FETCH_HEAD || { git rebase --abort || true; }
            sleep 5
          done
          echo "publishing the logs failed after five attempts" >&2
          exit 1
