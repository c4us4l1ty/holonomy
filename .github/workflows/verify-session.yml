name: Verify Holonomy UI
on:
  push:
    branches: ['arena/ca2b02bd-holonomy']
permissions:
  contents: write
concurrency:
  group: verify-ca2b02bd
  cancel-in-progress: true
jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.98.1
          targets: x86_64-unknown-linux-musl
          components: rustfmt
      - name: Formatting
        run: |
          cargo fmt --all
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u
            git commit -m "style: apply rustfmt"
            git push origin HEAD:arena/ca2b02bd-holonomy
          fi
          cargo fmt --all -- --check
      - name: Check sealed and desktop targets
        run: |
          set -o pipefail
          cargo check --workspace --all-targets --message-format=short 2>&1 | tee /tmp/check.log
          cargo check --workspace --all-targets --features holonomy/desktop --message-format=short 2>&1 | tee -a /tmp/check.log
      - name: Publish check diagnostics
        if: failure()
        run: |
          tail -n 300 /tmp/check.log > ci-check.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-check.log
          git commit -m "ci: publish check diagnostics" || true
          git push origin HEAD:arena/ca2b02bd-holonomy || true
      - name: Release tests
        run: |
          set -o pipefail
          cargo test --workspace --release -- --test-threads=1 2>&1 | tee /tmp/test.log
      - name: Desktop tests
        run: |
          set -o pipefail
          cargo test -p holonomy --features desktop --release -- --test-threads=2 2>&1 | tee -a /tmp/test.log
          cargo test -p holonomy-input --features desktop --release 2>&1 | tee -a /tmp/test.log
          cargo test -p holonomy-x11 --release 2>&1 | tee -a /tmp/test.log
          cargo test -p holonomy-display --features desktop --release 2>&1 | tee -a /tmp/test.log
      - name: Publish test diagnostics
        if: failure()
        run: |
          tail -n 400 /tmp/test.log > ci-test.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-test.log
          git commit -m "ci: publish test diagnostics" || true
          git push origin HEAD:arena/ca2b02bd-holonomy || true
