name: Verify Holonomy UI
on:
  push:
    branches: ['arena/ca2b02bd-holonomy']
permissions:
  contents: read
concurrency:
  group: verify-ca2b02bd
  cancel-in-progress: true
jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.98.1
          targets: x86_64-unknown-linux-musl
          components: rustfmt
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Check sealed and desktop targets
        run: |
          cargo check --workspace --all-targets
          cargo check --workspace --all-targets --features holonomy/desktop
      - name: Release tests
        run: cargo test --workspace --release -- --test-threads=1
      - name: Desktop tests
        run: |
          cargo test -p holonomy --features desktop --release -- --test-threads=2
          cargo test -p holonomy-input --features desktop --release
          cargo test -p holonomy-x11 --release
          cargo test -p holonomy-display --features desktop --release
