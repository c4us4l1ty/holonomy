# Temporary verification for the usability repair branch. Removed before merge.
name: Verify session branch
on:
  push:
    branches: ['arena/10a94257-holonomy']
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.98.1
          targets: x86_64-unknown-linux-musl
          components: rustfmt, clippy
      - name: Check default target
        run: |
          if ! cargo check --workspace --all-targets --message-format=short > /tmp/check.log 2>&1; then
            grep -E 'error|warning' /tmp/check.log | head -40
            exit 1
          fi
      - name: Check desktop target
        run: |
          if ! cargo check --workspace --all-targets --features holonomy/desktop --message-format=short > /tmp/check.log 2>&1; then
            grep -E 'error|warning' /tmp/check.log | head -40
            exit 1
          fi
      - name: Release tests
        run: cargo test --workspace --release -- --test-threads=2
      - name: Desktop tests
        run: cargo test -p holonomy --features desktop --release -- --test-threads=2
