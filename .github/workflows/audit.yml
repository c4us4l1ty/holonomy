  cli-regressions:
    name: CLI safety regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Lint CLI
        run: cargo clippy -p holonomy-cli --all-targets -- -D warnings
      - name: Test redacted document buffer
        run: cargo test -p holonomy-session --lib a_saved_container_reopens_to_the_bytes_that_went_in
      - name: Run focused CLI safety tests
        run: |
          set -euo pipefail
          for test in partial_ratchet_requires_recovery_after_replacement ratchet_count_must_match_the_full_window save_reports_unestablished_pad_freshness the_store_layer_does_not_claim_pad_freshness session_refuses_image_changed_since_open_before_pad_access session_updates_baseline_after_each_successful_save save_refuses_changed_path_before_pad_access save_refuses_same_size_original_change_without_ratchet verify_reports_snapshot_digest_and_rejects_tampered_payload verify_checks_candidate_without_printing_or_modifying_plaintext preflight_rejections_do_not_touch_file_or_require_recovery standalone_container_refuses_extra_bytes_without_reading_pad_or_replacing standalone_container_refuses_growth_before_replacement standalone_container_rejects_truncation external_document_sessions_use_production_kdf_profile create_rejects_invalid_options_without_creating_a_file failed_ratchet_requires_recovery_even_after_image_was_replaced external_store_api_is_available_without_the_binary staged_replacement_updates_file_and_open_handle staged_replacement_refuses_changed_path prompted_credentials_are_confirmed_and_fail_closed explicit_credentials_do_not_prompt open_rejects_cursor_alias_even_when_pad_window_matches pad_reuse_boundary_refuses_without_touching_container provision_rejects_nonzero_cursor_without_creating_file input_is_bounded_and_exact_limit_is_accepted kappa_rejects_non_ascii_without_panicking kappa_accepts_upper_and_lowercase_hex flags_reject_missing_values_duplicates_and_extra_paths save_rejects_provisioning_cursor_without_changing_container provision_refuses_existing_path_without_overwriting_it; do
            output=$(cargo test -p holonomy-cli "$test" -- --nocapture 2>&1) || { echo "$output"; exit 1; }
            echo "$output"
            echo "$output" | grep -qE 'test result: ok\. [1-9]' || { echo "::error::no test matched $test"; exit 1; }
          done
