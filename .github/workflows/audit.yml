          gate -p holonomy-crypto no_environmental_input_enters_a_key
          gate -p holonomy-crypto no_branchless_decoy_selection
      # The duress requirement, against a real ten-save history rather than a described one.
      - name: The duress passphrase opens every historical snapshot
        run: cargo test -p holonomy-crypto --test duress_history -- --nocapture

      - name: Reaper wipes before it terminates, and never on a suspend signal
