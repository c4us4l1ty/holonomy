name: Audit

# Runs the gates that make docs/PRD-v5.1.0.md §12 true, and the source audits that defend the
# invariants v5.1.0 deleted.
#
# Deliberately split in two. The five non-`wordcraft` crates build anywhere; `holonomy-ui` needs
# crates.io plus wordcraft's pinned `craft-*` git dependencies, and its graph transitively reaches
# `craft-pdf`, which does not compile at the pinned rev. The gates that decide whether a container
# is safe must not depend on that.
on:

  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: never
  RUSTFLAGS: "-D warnings"
  PACKAGES: "-p holonomy-core -p holonomy-crypto -p holonomy-usb -p holonomy-runtime -p holonomy-session -p holonomy-cli"

# The crates that build without `wordcraft`. Kept as one list so a gate cannot quietly test a
# subset of the product.
#   PACKAGES = -p holonomy-core -p holonomy-crypto -p holonomy-usb -p holonomy-runtime
#              -p holonomy-session -p holonomy-cli

jobs:
  # rustfmt is deterministic and non-negotiable, so it should not be something a human round-trips
  # through review. This job formats and, if that changed anything, commits and pushes; the next
  # run finds nothing to do. It needs a real branch (not a detached HEAD) and must re-fetch, because
  # two pushes in quick succession otherwise leave it holding a stale commit whose push is rejected.

  format:
    name: rustfmt
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write
    env:
      BRANCH: ${{ github.ref_name }}
    steps:

      - uses: actions/checkout@v4

      - run: rustup toolchain install stable --profile minimal --component rustfmt
      # `cargo check` needs the crates registry, and a cold cache makes this the slowest job.
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: fmt-check-${{ hashFiles('**/Cargo.lock') }}

      - name: Format and commit
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          git checkout -B "$BRANCH" "origin/$BRANCH"

          # Generated junk is removed *before* the dirty check, not after. Putting this later meant
          # that when formatting changed nothing the tree still looked dirty (an untracked
          # `Cargo.lock`), the step went on to `git commit` with nothing staged, and `set -e` ended
          # it with a bare exit code -- which is how this job spent three runs reporting "rustfmt
          # failed" for a tree that was perfectly formatted.
          rm -f Cargo.lock

          if ! cargo fmt --all; then
            echo "::error::cargo fmt failed"
            exit 1
          fi
          # `status --porcelain`, not `diff --quiet`: the latter ignores files formatting would
          # create, which is a class of change this gate should not silently skip.
          if [ -z "$(git status --porcelain)" ]; then
            echo "already formatted"
            exit 0
          fi
          echo "::notice::formatting changed; the fix commit follows after a build check"

          # The formatted tree must compile before it is pushed. This job used to format and push
          # without building, and a push made with the default token does not trigger a workflow
          # run -- so every formatting fix commit was a commit nothing had ever compiled. Two of
          # them in this repository's history fixed a build error and were merged on the strength of
          # the run that had *failed* against the unformatted tree.
          #
          # `|| { ... }` so a compile error is annotated rather than ending the step with a bare
          # exit code: without it the only annotation was a list of dirty files, and the compiler's
          # message -- the one thing worth reading -- was never surfaced.
          if ! cargo check --workspace --exclude holonomy-ui --all-targets 2>&1 | tee /tmp/check.log; then
            grep -E '^error' /tmp/check.log | head -20 | while IFS= read -r line; do
              echo "::error::pre-push check: $line"
            done
            exit 1
          fi

          git config user.name  "holonomy-ci"
          git config user.email "ci@holonomy.invalid"
          git add -A
          git commit -m "style: cargo fmt (automated, no manual edits)"
          git push origin "HEAD:refs/heads/$BRANCH" || {
            git fetch origin "$BRANCH"
            git rebase "origin/$BRANCH"
            if ! cargo check --workspace --exclude holonomy-ui --all-targets 2>&1 | tee /tmp/check2.log; then
              grep -E '^error' /tmp/check2.log | head -20 | while IFS= read -r line; do
                echo "::error::post-rebase check: $line"
              done
              exit 1
            fi
            git push origin "HEAD:refs/heads/$BRANCH"
          }

      - name: Report formatting failures as annotations
        if: failure()
        run: |
          set +e
          echo "::error::rustfmt gate failed"
          cargo fmt --all -- --check 2>&1 | head -30 | while IFS= read -r line; do
            [ -n "$line" ] && echo "::error::fmt: $line"
          done
          git status --porcelain | head -20 | while IFS= read -r line; do
            echo "::error::dirty: $line"
          done
          for f in /tmp/check.log /tmp/check2.log; do
            [ -f "$f" ] && grep -E '^error' "$f" | head -20 | while IFS= read -r line; do
              echo "::error::compile: $line"
            done
          done

  core-crates:
    name: core crates (no wordcraft)
    runs-on: ubuntu-latest
    needs: format
    # `needs: format` alone means "skip if format was skipped", and format is push-only. That made
    # every pull request run zero checks: four green-looking "skipping" entries and no gate at all.
    #
    # `always()` and no condition on `format`'s *result*, only on whether it ran: a formatting job
    # that fails must not be able to hide a compiler error by skipping the job that reports it. That
    # is what happened while the fmt job was misbehaving -- four consecutive runs showed
    # "rustfmt: failure, everything else: skipped" and the build error underneath was invisible.
    # Formatting is now a separate report, not a gate in front of compilation.
    if: always() && (needs.format.result == 'success' || needs.format.result == 'failure' || needs.format.result == 'skipped')
    steps:

      - uses: actions/checkout@v4

      - name: Install the toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
          rustc --version
          cargo --version

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      # `--message-format=short` keeps each diagnostic on one line with `file:line:col: error: ...`,
      # which is what the annotation step below turns into a check annotation. That matters because
      # GitHub's raw job logs live on a blob host this project's CI author cannot reach; annotations
      # come back through api.github.com instead.
      - name: Build
        run: |
          set -o pipefail
          cargo build ${{ env.PACKAGES }} --all-targets --message-format=short 2>&1 | tee build.log

      - name: Report compiler errors as annotations
        if: failure()
        run: |
          set +e
          grep -E ': (error|warning)(\[[A-Z0-9]+\])?:' build.log | head -60 | while IFS= read -r line; do
            echo "::error::$line"
          done
          echo "### context (last 80 lines)"
          tail -80 build.log

      - name: Test
        run: |
          set -o pipefail

          # Every `cargo test` below goes through `gate`, and the reason is not tidiness.
          # `cargo test <filter>` exits 0 when the filter matches *nothing*, so a test renamed
          # without updating this file turns a gate into a no-op that reports success. That is
          # not hypothetical here: `the_fold_does_not_move_the_salt_or_the_capsule` was invoked
          # by this workflow while no test by that name existed. `gate` requires a non-zero pass
          # count and prints the output when it refuses.
          gate() {
            local out
            if ! out=$(cargo test "$@" -- --nocapture 2>&1); then
              printf '%s\n' "$out"
              echo "::error::gate failed: $*"
              exit 1
            fi
            if ! printf '%s\n' "$out" | grep -qE "test result: ok\. [1-9]"; then
              printf '%s\n' "$out"
              echo "::error::gate matched no test: $*"
              exit 1
            fi
          }
          # Not through `gate`: this is the whole suite with no filter, so "no test matched" is not
          # a state it can be in, and its output goes to `test.log` for the annotation step.
          cargo test ${{ env.PACKAGES }} --message-format=short 2>&1 | tee test.log

      - name: Report test failures as annotations
        if: failure()
        run: |
          set +e
          # A panic's location and its message are on consecutive lines, and an annotation that
          # carries only the location is useless: "panicked at store/tests.rs:62:50" says where, not
          # what. `grep -A2` and `tr` join them onto one line, which is what the annotation shows.
          grep -A2 "panicked at" test.log | tr '\n' ' ' | sed 's/panicked at/\npanicked at/g' | head -20 | while IFS= read -r line; do
            [ -n "$line" ] && echo "::error::$line"
          done
          grep -E "^(error|test result: FAILED)" test.log | head -20 | while IFS= read -r line; do
            echo "::error::$line"
          done
          grep -E "^---- .* stdout ----$" -A 12 test.log | head -200

      - name: Clippy
        run: |
          set -o pipefail
          cargo clippy ${{ env.PACKAGES }} --all-targets --message-format=short -- -D warnings 2>&1 | tee clippy.log

      - name: Report clippy findings as annotations
        if: failure()
        run: |
          set +e
          grep -E ': (error|warning)(\[[A-Z0-9]+\])?:' clippy.log | head -60 | while IFS= read -r line; do
            echo "::error::$line"
          done

      - name: Formatting
        run: |
          set -o pipefail
          cargo fmt --all -- --check 2>&1 | tee fmt.log

      - name: Report formatting as annotations
        if: failure()
        run: |
          set +e
          echo "### cargo fmt --check diff"
          head -40 fmt.log | tail -38
          grep -E '^Diff in ' fmt.log | head -40 | while IFS= read -r line; do
            echo "::error::$line"
          done

      # The binary is a gate in its own right: it must build and run before the memory job can
      # measure anything, and `--version` is the cheapest proof that the workspace links.
      - name: The store writes a container and reads it back
        # The first gate in this project that runs `holonomy save` and `holonomy open` against a real
        # file. A binary that "runs" is not a binary that saves.
        run: |
          # Every `cargo test` below goes through `gate`, and the reason is not tidiness.
          # `cargo test <filter>` exits 0 when the filter matches *nothing*, so a test renamed
          # without updating this file turns a gate into a no-op that reports success. That is
          # not hypothetical here: `the_fold_does_not_move_the_salt_or_the_capsule` was invoked
          # by this workflow while no test by that name existed. `gate` requires a non-zero pass
          # count and prints the output when it refuses.
          gate() {
            local out
            if ! out=$(cargo test "$@" -- --nocapture 2>&1); then
              printf '%s\n' "$out"
              echo "::error::gate failed: $*"
              exit 1
            fi
            if ! printf '%s\n' "$out" | grep -qE "test result: ok\. [1-9]"; then
              printf '%s\n' "$out"
              echo "::error::gate matched no test: $*"
              exit 1
            fi
          }
          gate -p holonomy-cli --bin holonomy the_fold_does_not_move_the_salt_or_the_capsule
          gate -p holonomy-cli --bin holonomy a_provisioned_container_opens_before_any_save
          gate -p holonomy-cli --bin holonomy the_first_save_after_provisioning_succeeds
          gate -p holonomy-cli --bin holonomy a_document_survives_a_save_and_a_reopen
          gate -p holonomy-cli --bin holonomy a_multi_slot_document_reassembles_in_order
          gate -p holonomy-cli --bin holonomy the_wrong_passphrase_fails_before_a_byte_is_written
          gate -p holonomy-cli --bin holonomy a_second_save_replaces_the_first
          gate -p holonomy-cli --bin holonomy consecutive_cursors_read_disjoint_sectors
          gate -p holonomy-cli --bin holonomy the_store_and_the_usb_crate_choose_the_same_sectors

      - name: The binary runs
        run: cargo run -q -p holonomy-cli -- --version

  invariants:
    name: invariant gates
    runs-on: ubuntu-latest
    needs: core-crates
    if: always() && needs.core-crates.result == 'success'
    steps:

      - uses: actions/checkout@v4

      - uses: actions/cache@v4
