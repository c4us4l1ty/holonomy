          gate -p holonomy-session a_wrong_passphrase_is_rejected_and_says_nothing
          gate -p holonomy-session a_wrong_usb_share_is_rejected
          gate -p holonomy-session an_unprovisioned_container_is_named_rather_than_rejected_as_a_bad_passphrase

      - name: A save is refused rather than silently downgraded
        run: |
          # Every `cargo test` below goes through `gate`, and the reason is not tidiness.
