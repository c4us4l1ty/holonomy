          # A `--test` target rather than a filter: the file is the claim ("the plan is
          # collision-free"), so there is no name to go stale. `gate` would read it as a filter.
          cargo test -p holonomy-usb --test property -- --nocapture
          gate -p holonomy-session the_plan_over_a_full_budget_is_disjoint

      - name: FPE-22 reaches the sectors FPE-20 excluded
        run: |
          # Every `cargo test` below goes through `gate`, and the reason is not tidiness.
          # `cargo test <filter>` exits 0 when the filter matches *nothing*, so a test renamed
