          gate -p holonomy-runtime thread_b_fires_and_wipes_when_the_heartbeat_stops
          gate -p holonomy-runtime the_wipe_runs_before_termination
          gate -p holonomy-runtime a_long_gap_without_a_suspend_notification_is_a_yank
          gate -p holonomy-runtime a_suspend_notification_suppresses_the_wipe
          gate -p holonomy-runtime it_reports_what_it_measures

  memory:
    name: memory envelope
    runs-on: ubuntu-latest
    needs: core-crates
    if: always() && needs.core-crates.result == 'success'
    steps:

      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Documented envelope fits a 2 GiB host
        run: cargo test -p holonomy-core envelope_holds_on_the_legacy_host -- --nocapture

      - name: The old 16.60 MiB claim is rejected as an understatement
        run: cargo test -p holonomy-core old_claim_is_rejected_as_an_understatement -- --nocapture

      - name: The gate is two-sided
        run: cargo test -p holonomy-core the_gate_is_two_sided -- --nocapture

      # The measured gate. This was a placeholder for as long as `holonomy` could not be built,
      # which meant the project's headline memory claim had never been measured by anything.
      #
      # The measurement comes from the process itself: `--check` reads VmHWM from
      # /proc/self/status, which is the kernel's own high-water mark and therefore does not depend
      # on external timing tools existing on the runner. An earlier version shelled out to
      # `/usr/bin/time -v`, which is not present everywhere and failed as `command not found` --
      # a gate that dies on a missing tool is not measuring the product.
      - name: Measured peak RSS is inside the envelope
        run: |
          # This step measures; it does not police the exit code. `--check` exiting non-zero is the
          # next step's job, because under `set -e` + `pipefail` a non-zero `cargo run | tee` aborts
          # this whole script and the measurement never happens. Conflating "measure" with "assert"
          # is what made this gate look like it was failing on its own parse.
          cargo run -q -p holonomy-cli -- --check > check.log 2>&1 || true
          cat check.log
          # `^` anchors the match to the start of the line, which is what keeps the budget figures
          # in the trailing "(budget 180 MiB ..., 440 MiB ...)" out of it. Do *not* anchor the end:
          # the line continues past the measurement, so `$` matches nothing at all and the gate
          # fails while reporting a perfectly good number. That happened: this step failed a run
          # whose measured peak was 17,756 KiB against a 184,320 KiB ceiling.
          # awk, not `sed | head -1`. Under `set -e` plus `pipefail` -- and Actions runs `bash -e`
          # -- a `head -1` that exits early sends SIGPIPE to sed, the pipeline returns 141, the
          # assignment fails and the shell aborts. That is exactly what happened: the gate reported
          # "measured-RSS gate failed: parsed 'peak RSS: 17648 KiB ...'" with a good number in the
          # message and no comparison run at all. awk reads the file to the end and `exit`s itself,
          # so there is no pipeline to poison.
          measured=$(awk '/^peak RSS:/ { print $3; exit }' check.log)
          if [ -z "$measured" ]; then
            echo "::error::--check did not report a peak RSS measurement"
            exit 1
          fi
          # The ceiling that applies to an idle process is the envelope's peak, not the
          # steady-state figure: `--check` does not open the container, and refusing to let an idle
          # process measure 17 MiB was the gate reporting a correct measurement as a violation.
          ceiling=$((440 * 1024))
          echo "measured peak RSS: ${measured} KiB; envelope ceiling ${ceiling} KiB (440 MiB)"
          if [ "$measured" -gt "$ceiling" ]; then
            echo "::error::measured ${measured} KiB exceeds the ${ceiling} KiB (180 MiB) ceiling"
            exit 1
          fi
          echo "inside the ceiling"
          # Belt and braces: if this step is reported as failed by something other than the
          # comparisons above, say so explicitly rather than leaving the next reader to infer it.
          echo "rss-gate: parsed=${measured} ceiling=${ceiling}"

      - name: Report the measured RSS step as annotations
        if: failure()
        run: |
          set +e
          # One annotation, not a loop: GitHub keeps about ten per step and drops the remainder, so
          # a loop over the report loses exactly the lines at the bottom.
          echo "::error::measured-RSS gate failed: parsed '$(grep -E '^peak RSS' check.log 2>/dev/null | head -1)'"
          { echo '## holonomy --check (measured RSS)'; echo '```'; cat check.log 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: check exits zero on this runner
        run: |
          set -o pipefail
          cargo run -q -p holonomy-cli -- --check 2>&1 | tee check-exit.log

      - name: Report check findings as annotations
        if: failure()
        run: |
          log=check-exit.log
          [ -f "$log" ] || log=check.log
          echo "### holonomy --check"
          cat "$log"
          # GitHub keeps about ten annotations per step and silently drops the rest, so annotate
          # sparingly: the one-line tally, then each failing gate (there are never many).
          tally=$(grep -E '^[0-9]+ ok, ' "$log" | tail -1)
          echo "::error::--check tally: ${tally:-<no tally line>}"
          # Failing gates first: they are the reason this step exists, and the annotation budget
          # runs out partway through the list.
          grep -Ei '^\[fail' "$log" | head -4 | while IFS= read -r line; do
            echo "::error::$line"
          done
          grep -E '^\[(degraded|deferred)' "$log" | head -4 | while IFS= read -r line; do
            echo "::error::note: $line"
          done
          { echo '## holonomy --check'; echo '```'; cat "$log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
