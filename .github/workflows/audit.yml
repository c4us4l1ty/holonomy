          gate -p holonomy-crypto --lib directory_plaintext_is_returned_whole
          gate -p holonomy-crypto --test two_phase unlock_recovers_the_directory

      - name: Pad budget is 54 saves with zero overlap
        run: |
          # Every `cargo test` below goes through `gate`, and the reason is not tidiness.
          # `cargo test <filter>` exits 0 when the filter matches *nothing*, so a test renamed
