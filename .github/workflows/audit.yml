          gate -p holonomy-core old_tolerance_is_ten_sigma
          gate -p holonomy-core barely_changed_snapshot_fails_on_the_run_gate
          gate -p holonomy-core a_one_percent_bias_is_caught_at_container_scale

      - name: No environmental input reaches a key
        run: |
          # Every `cargo test` below goes through `gate`, and the reason is not tidiness.
