name: Audit

# Runs the gates that make docs/PRD-v5.1.0.md §12 true, and the source audits that defend the
# invariants v5.1.0 deleted.
#
# Deliberately split in two. The five non-`wordcraft` crates build anywhere; `holonomy-ui` needs
# crates.io plus wordcraft's pinned `craft-*` git dependencies, and its graph transitively reaches
# `craft-pdf`, which does not compile at the pinned rev. The gates that decide whether a container
# is safe must not depend on that.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: never
  RUSTFLAGS: "-D warnings"
  PACKAGES: "-p holonomy-core -p holonomy-crypto -p holonomy-usb -p holonomy-runtime -p holonomy-session -p holonomy-cli"

# The crates that build without `wordcraft`. Kept as one list so a gate cannot quietly test a
# subset of the product.
#   PACKAGES = -p holonomy-core -p holonomy-crypto -p holonomy-usb -p holonomy-runtime
#              -p holonomy-session -p holonomy-cli

jobs:
  # rustfmt is deterministic and non-negotiable, so it should not be something a human round-trips
  # through review. This job formats and, if that changed anything, commits and pushes; the next
  # run finds nothing to do. It needs a real branch (not a detached HEAD) and must re-fetch, because
  # two pushes in quick succession otherwise leave it holding a stale commit whose push is rejected.
  format:
    name: rustfmt
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write
    env:
      BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component rustfmt
      - name: Format and commit
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          git checkout -B "$BRANCH" "origin/$BRANCH"
          cargo fmt --all
          # `status --porcelain`, not `diff --quiet`: the latter ignores files formatting would
          # create, which is a class of change this gate should not silently skip.
          if [ -z "$(git status --porcelain)" ]; then
            echo "already formatted"
            exit 0
          fi
          git config user.name  "holonomy-ci"
          git config user.email "ci@holonomy.invalid"
          git add -A
          git commit -m "style: cargo fmt (automated, no manual edits)"
          git push origin "HEAD:refs/heads/$BRANCH" || {
            git fetch origin "$BRANCH"
            git rebase "origin/$BRANCH"
            git push origin "HEAD:refs/heads/$BRANCH"
          }
      - name: Report formatting failures as annotations
        if: failure()
        run: |
          set +e
          echo "::error::rustfmt gate failed"
          cargo fmt --all -- --check 2>&1 | head -30 | while IFS= read -r line; do
            [ -n "$line" ] && echo "::error::fmt: $line"
          done
          git status --porcelain | head -20 | while IFS= read -r line; do
            echo "::error::dirty: $line"
          done

  core-crates:
    name: core crates (no wordcraft)
    runs-on: ubuntu-latest
    needs: format
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
          rustc --version
          cargo --version

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      # `--message-format=short` keeps each diagnostic on one line with `file:line:col: error: ...`,
      # which is what the annotation step below turns into a check annotation. That matters because
      # GitHub's raw job logs live on a blob host this project's CI author cannot reach; annotations
      # come back through api.github.com instead.
      - name: Build
        run: |
          set -o pipefail
          cargo build ${{ env.PACKAGES }} --all-targets --message-format=short 2>&1 | tee build.log

      - name: Report compiler errors as annotations
        if: failure()
        run: |
          set +e
          grep -E ': (error|warning)(\[[A-Z0-9]+\])?:' build.log | head -60 | while IFS= read -r line; do
            echo "::error::$line"
          done
          echo "### context (last 80 lines)"
          tail -80 build.log

      - name: Test
        run: |
          set -o pipefail
          cargo test ${{ env.PACKAGES }} --message-format=short 2>&1 | tee test.log

      - name: Report test failures as annotations
        if: failure()
        run: |
          set +e
          grep -E "^(error|failures:)|panicked at|test result: FAILED" test.log | head -60 | while IFS= read -r line; do
            echo "::error::$line"
          done
          grep -E "^---- .* stdout ----$" -A 12 test.log | head -200

      - name: Clippy
        run: |
          set -o pipefail
          cargo clippy ${{ env.PACKAGES }} --all-targets --message-format=short -- -D warnings 2>&1 | tee clippy.log

      - name: Report clippy findings as annotations
        if: failure()
        run: |
          set +e
          grep -E ': (error|warning)(\[[A-Z0-9]+\])?:' clippy.log | head -60 | while IFS= read -r line; do
            echo "::error::$line"
          done

      - name: Formatting
        run: |
          set -o pipefail
          cargo fmt --all -- --check 2>&1 | tee fmt.log

      - name: Report formatting as annotations
        if: failure()
        run: |
          set +e
          echo "### cargo fmt --check diff"
          head -40 fmt.log | tail -38
          grep -E '^Diff in ' fmt.log | head -40 | while IFS= read -r line; do
            echo "::error::$line"
          done

      # The binary is a gate in its own right: it must build and run before the memory job can
      # measure anything, and `--version` is the cheapest proof that the workspace links.
      - name: The binary runs
        run: cargo run -q -p holonomy-cli -- --version

  invariants:
    name: invariant gates
    runs-on: ubuntu-latest
    needs: core-crates
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-
      - run: rustup toolchain install stable --profile minimal && rustup default stable

      # The compile-time assertions in holonomy-core are the deliverable for FR-4.3. A build is the
      # proof, so this job's content is "does the assertion hold", one claim per step so a failure
      # names the claim it broke.
      - name: Capsule is exactly 65,536 bytes
        run: |
          cargo test -p holonomy-core capsule_is_exactly_one_slot -- --nocapture
          cargo test -p holonomy-core field_sum_matches_the_audited_table -- --nocapture

      - name: Directory is a fixed length, so its commitment can be verified
        run: |
          cargo test -p holonomy-crypto directory_tests -- --nocapture
          cargo test -p holonomy-crypto --test two_phase unlock_recovers_the_directory -- --nocapture

      - name: Pad budget is 54 saves with zero overlap
        run: |
          cargo test -p holonomy-core never_collide -- --nocapture
          cargo test -p holonomy-core the_budget_is_a_pigeonhole_bound -- --nocapture
          cargo test -p holonomy-usb --test property -- --nocapture
          cargo test -p holonomy-session the_plan_over_a_full_budget_is_disjoint -- --nocapture

      - name: FPE-22 reaches the sectors FPE-20 excluded
        run: |
          cargo test -p holonomy-core full_zone_b_is_reachable -- --nocapture
          cargo test -p holonomy-usb sectors_that_fpe_20_could_never_reach_are_reached -- --nocapture
          cargo test -p holonomy-usb the_pad_budget_uses_more_than_half_the_drive -- --nocapture

      - name: A save is refused rather than silently downgraded
        run: |
          cargo test -p holonomy-session the_fifty_fifth_save_on_a_read_only_device_is_refused -- --nocapture
          cargo test -p holonomy-session a_partial_ratchet_is_refused_rather_than_counted -- --nocapture
          cargo test -p holonomy-session a_refused_save_does_not_advance_the_budget -- --nocapture
          cargo test -p holonomy-crypto pad_budget -- --nocapture

      - name: Statistical gates use the corrected constants
        run: |
          cargo test -p holonomy-core sigma_is_the_documented_number -- --nocapture
          cargo test -p holonomy-core old_tolerance_is_ten_sigma -- --nocapture
          cargo test -p holonomy-core barely_changed_snapshot_fails_on_the_run_gate -- --nocapture
          cargo test -p holonomy-core a_one_percent_bias_is_caught -- --nocapture

      - name: No environmental input reaches a key
        run: |
          cargo test -p holonomy-crypto no_environmental_input_enters_a_key -- --nocapture
          cargo test -p holonomy-crypto no_branchless_decoy_selection -- --nocapture

      # The duress requirement, against a real ten-save history rather than a described one.
      - name: The duress passphrase opens every historical snapshot
        run: cargo test -p holonomy-crypto --test duress_history -- --nocapture

      - name: Reaper wipes before it terminates, and never on a suspend signal
        run: |
          cargo test -p holonomy-runtime thread_b_fires_and_wipes -- --nocapture
          cargo test -p holonomy-runtime the_wipe_runs_before_termination -- --nocapture
          cargo test -p holonomy-runtime a_long_gap_without_a_suspend_notification_is_a_yank -- --nocapture
          cargo test -p holonomy-runtime a_suspend_notification_suppresses_the_wipe -- --nocapture
          cargo test -p holonomy-runtime it_reports_what_it_measures -- --nocapture

  memory:
    name: memory envelope
    runs-on: ubuntu-latest
    needs: core-crates
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-
      - run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Documented envelope fits a 2 GiB host
        run: cargo test -p holonomy-core envelope_holds_on_the_legacy_host -- --nocapture

      - name: The old 16.60 MiB claim is rejected as an understatement
        run: cargo test -p holonomy-core old_claim_is_rejected_as_an_understatement -- --nocapture

      - name: The gate is two-sided
        run: cargo test -p holonomy-core the_gate_is_two_sided -- --nocapture

      # The measured gate. This was a placeholder for as long as `holonomy` could not be built,
      # which meant the project's headline memory claim had never been measured by anything.
      #
      # The measurement comes from the process itself: `--check` reads VmHWM from
      # /proc/self/status, which is the kernel's own high-water mark and therefore does not depend
      # on external timing tools existing on the runner. An earlier version shelled out to
      # `/usr/bin/time -v`, which is not present everywhere and failed as `command not found` --
      # a gate that dies on a missing tool is not measuring the product.
      - name: Measured peak RSS is inside the steady-state ceiling
        run: |
          set -x
          set -o pipefail
          cargo run -q -p holonomy-cli -- --check 2>&1 | tee check.log
          # `^` anchors the match to the start of the line, which is what keeps the budget figures
          # in the trailing "(budget 180 MiB ..., 440 MiB ...)" out of it. Do *not* anchor the end:
          # the line continues past the measurement, so `$` matches nothing at all and the gate
          # fails while reporting a perfectly good number. That happened: this step failed a run
          # whose measured peak was 17,756 KiB against a 184,320 KiB ceiling.
          measured=$(sed -n 's/^peak RSS: \([0-9][0-9]*\) KiB.*/\1/p' check.log | head -1)
          if [ -z "$measured" ]; then
            echo "::error::--check did not report a peak RSS measurement"
            exit 1
          fi
          ceiling=$((180 * 1024))
          echo "measured peak RSS: ${measured} KiB; ceiling ${ceiling} KiB (180 MiB)"
          if [ "$measured" -gt "$ceiling" ]; then
            echo "::error::measured ${measured} KiB exceeds the ${ceiling} KiB (180 MiB) ceiling"
            exit 1
          fi
          echo "inside the ceiling"
          # Belt and braces: if this step is reported as failed by something other than the
          # comparisons above, say so explicitly rather than leaving the next reader to infer it.
          echo "rss-gate: parsed=${measured} ceiling=${ceiling}"

      - name: Report the measured RSS step as annotations
        if: failure()
        run: |
          set +e
          # One annotation, not a loop: GitHub keeps about ten per step and drops the remainder, so
          # a loop over the report loses exactly the lines at the bottom.
          echo "::error::measured-RSS gate failed: parsed '$(grep -E '^peak RSS' check.log 2>/dev/null | head -1)'"
          { echo '## holonomy --check (measured RSS)'; echo '```'; cat check.log 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: check exits zero on this runner
        run: |
          set -o pipefail
          cargo run -q -p holonomy-cli -- --check 2>&1 | tee check-exit.log
      - name: Report check findings as annotations
        if: failure()
        run: |
          set +e
          # GitHub caps a step at about ten annotations and silently drops the rest. A whole report
          # of `::error::` lines therefore loses its tail -- which, in a report that ends with the
          # summary, is the part worth reading. So: one annotation that says what failed, and the
          # entire report into the step summary, which has no such limit.
          failed=$(grep -cE '^\[failed' check-exit.log 2>/dev/null || echo 0)
          echo "::error::--check reported ${failed} failing gate(s); full report in the step summary"
          grep -E '^\[failed' check-exit.log 2>/dev/null | head -5 | while IFS= read -r line; do
            echo "::error::$line"
          done
          { echo '## holonomy --check'; echo '```'; cat check-exit.log 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
