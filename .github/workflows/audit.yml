      - name: A container this build writes is a container it can read
        # The round trip. Until this step existed, the writer and the reader had never been run
        # against each other, which is how `seal_container` came to seal the payload under one key
        # and the directory under another while every test passed.
        run: |
          # Every `cargo test` below goes through `gate`, and the reason is not tidiness.
