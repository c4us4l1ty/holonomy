name: Native UI preview
on:
  push:
    branches: ["main", "arena/**"]
    paths:
      - "crates/holonomy-native/**"
      - "crates/holonomy-eye/**"
      - "crates/holonomy-gui/**"
      - ".github/workflows/release.yml"
      - "crates/holonomy-shell/**"
      - "crates/holonomy-text/**"
      - "crates/holonomy-line/**"
      - "crates/holonomy-seal/**"
      - "vendor/xattr/**"
      - "scripts/qualify-native-ui.sh"
      - "scripts/run-desktop.sh"
      - "holonomy"
      - "scripts/desktop-launch.py"
      - "scripts/test-desktop-launch.py"
      - "scripts/qualify-fedora.sh"
      - "scripts/test-run-desktop.py"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/native-ui.yml"
  pull_request:
  workflow_dispatch:
env:
  CI_DIAG_ISSUE: "128"
permissions:
  contents: read
jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libfontconfig1-dev libasound2-dev libssl-dev xvfb xdotool xclip x11-utils imagemagick mesa-vulkan-drivers
      - name: Test desktop build helper without launching a display
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python3 scripts/test-run-desktop.py 2>&1 | tee -a native-check.log
          python3 scripts/test-desktop-launch.py 2>&1 | tee -a native-check.log
          exit "${PIPESTATUS[0]}"
      - name: Resolve, format and compile preview
        shell: bash
        run: |
          cargo fmt --all -- --check 2>&1 | tee native-check.log
          cargo clippy --locked -p holonomy-native --features native-ui -- -D warnings 2>&1 | tee -a native-check.log
          exit "${PIPESTATUS[0]}"
      - name: Test native session boundary
        shell: bash
        run: |
          cargo test --locked -p holonomy-native --lib 2>&1 | tee -a native-check.log
          exit "${PIPESTATUS[0]}"
      - name: Test frontend composition guard
        shell: bash
        run: |
          cargo test --locked -p holonomy-native --features native-ui --bin holonomy-native 2>&1 | tee -a native-check.log
          exit "${PIPESTATUS[0]}"
      - name: Build runnable preview and companion editor
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_DEV_OPT_LEVEL: "1"
        run: |
          cargo build --locked -p holonomy-native -p holonomy-gui --bin holonomy-native --bin holonomy-gui --features holonomy-native/native-ui
      - name: Exercise actual native input, encrypted save and reopen under Xvfb
        if: runner.os == 'Linux'
        shell: bash
        env:
          HOLONOMY_NATIVE_SMOKE_PATH: ${{ runner.temp }}/native-smoke.wavefunction
          GPUI_X11_SCALE_FACTOR: "2"
        run: |
          for scale in 1 1.25 1.5 1.75 2; do
            GPUI_X11_SCALE_FACTOR="$scale" xvfb-run -a -s "-screen 0 2560x1800x24" scripts/qualify-native-ui.sh 2>&1 | tee -a native-check.log
            mv native-smoke.png "native-smoke-${scale}.png"
          done
      - name: Export Linux test-only encrypted fixture harness
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo test --locked -p holonomy-native --lib --no-run --message-format=json > fixture-build.json
          python3 - <<'PYTHON'
          import json, shutil
          for line in open("fixture-build.json"):
              item = json.loads(line)
              if item.get("reason") == "compiler-artifact" and item.get("executable") and item["target"]["name"] == "holonomy_native":
                  shutil.copyfile(item["executable"], "native-fixture")
                  break
          else:
              raise SystemExit("missing native fixture executable")
          PYTHON
      - name: Upload test-only Linux fixture
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: native-fixture-linux
          path: native-fixture
      - name: Include source and font license notices with every executable bundle
        shell: bash
        run: cat LICENSE-MIT LICENSE-APACHE THIRD_PARTY.md LICENSES/*.txt vendor/xattr/LICENSE-* > target/debug/THIRD-PARTY-NOTICES.txt
      - name: Upload runnable preview
        uses: actions/upload-artifact@v4
        with:
          name: holonomy-native-preview-${{ matrix.os }}
          path: |
            target/debug/holonomy-native
            target/debug/holonomy-native.exe
            target/debug/holonomy-gui
            target/debug/holonomy-gui.exe
            target/debug/THIRD-PARTY-NOTICES.txt
      - name: Capture formatter patch without hiding a failed check
        if: always()
        shell: bash
        run: |
          cargo fmt --all
          git diff > native-format.patch
      - name: Save compiler diagnostics and generated metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-ui-${{ matrix.os }}
          path: |
            Cargo.lock
            crates/holonomy-native/src/main.rs
            native-check.log
            native-format.patch
            native-smoke*.png
            native-failure.png
            native-refused-save.png
            native-busy.png
            native-home.png
            native-compact.png
            native-unlock.png
            crates/holonomy-native/src/lib.rs
  fedora:
    name: Fedora ${{ matrix.version }} runtime (no compiler)
    needs: qualify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        version: ["44", "45"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: holonomy-native-preview-ubuntu-latest
          path: target/debug
      - uses: actions/download-artifact@v4
        with:
          name: native-fixture-linux
          path: target/debug
      - name: Test the exact downloadable executables inside Fedora
        shell: bash
        run: |
          set -o pipefail
          docker run --rm -v "$PWD:/work" -w /work fedora:${{ matrix.version }} bash scripts/qualify-fedora.sh 2>&1 | tee fedora-runtime.log
      - name: Preserve Fedora runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-ui-fedora-${{ matrix.version }}
          path: |
            fedora-runtime.log
            native-smoke*.png
            native-failure.png
            native-refused-save.png
            native-busy.png
            native-home.png
            native-compact.png
  publish-desktop:
    name: Publish source-matched experimental desktop
    needs: [qualify, fedora]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: holonomy-native-preview-ubuntu-latest
          path: bundle
      - name: Package the Fedora-tested binaries, without test fixture or document
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          chmod 755 bundle/holonomy-gui bundle/holonomy-native
          tar czf holonomy-linux-x86_64.tar.gz -C bundle holonomy-gui holonomy-native THIRD-PARTY-NOTICES.txt
          sha256sum holonomy-linux-x86_64.tar.gz > holonomy-linux-x86_64.tar.gz.sha256
          gh release create "desktop-$GITHUB_SHA" --target "$GITHUB_SHA" --prerelease \
            --title "Experimental GPUI desktop ${GITHUB_SHA:0:12}" \
            --notes "Source-matched Linux x86_64 development build. The exact executables passed encrypted runtime smoke tests on Fedora 44 and 45 under Xvfb/software Vulkan, including 200% scale. Not a hardware/Wayland/security/visual certification. No compiler is required to run. Runtime graphics libraries/drivers are still required. Use test documents. Checksums detect corruption, not an independent signature. Install/run from the matching checkout with ./holonomy." \
            holonomy-linux-x86_64.tar.gz holonomy-linux-x86_64.tar.gz.sha256
      - name: Verify anonymous public download through the actual bootstrap
        timeout-minutes: 5
        shell: bash
        run: |
          python3 - <<'PYTHON' 2>&1 | tee native-public-download.log
          import hashlib
          import importlib.util
          import os
          from pathlib import Path
          import subprocess
          import tempfile
          spec = importlib.util.spec_from_file_location("desktop_launch", "scripts/desktop-launch.py")
          launcher = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(launcher)
          # No GH_TOKEN or authorization header: exercise the same public URLs as the user.
          assert "GH_TOKEN" not in os.environ
          with tempfile.TemporaryDirectory() as temp:
              cache = launcher.install(Path(temp), os.environ["GITHUB_SHA"])
              for name in launcher.MEMBERS:
                  downloaded = hashlib.sha256((cache / name).read_bytes()).digest()
                  original = hashlib.sha256((Path("bundle") / name).read_bytes()).digest()
                  assert downloaded == original, name
              subprocess.run([str(cache / "holonomy-gui"), "--help"], check=True)
          print("HOLONOMY_PUBLIC_BOOTSTRAP verified=true anonymous=true source_matched=true")
          PYTHON
      - name: Preserve public bootstrap evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-ui-publication
          path: native-public-download.log
  bridge:
    needs: [qualify, fedora, publish-desktop]
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      issues: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: native-ui-*
          path: native-results
      - name: Publish sandbox-readable results
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tar czf native-results.tgz native-results
          base64 -w0 native-results.tgz | split -b 50000 -d - chunk-
          for chunk in chunk-*; do
            { echo "Native UI results $GITHUB_SHA ${chunk}"; cat "$chunk"; echo; } > body.txt
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/${CI_DIAG_ISSUE}/comments" -F body=@body.txt --silent
          done
