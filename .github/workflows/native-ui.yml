name: Native UI preview
on:
  push:
    branches: ["main", "arena/**"]
    paths:
      - "crates/holonomy-native/**"
      - "crates/holonomy-eye/**"
      - "crates/holonomy-gui/**"
      - ".github/workflows/release.yml"
      - "crates/holonomy-shell/**"
      - "crates/holonomy-text/**"
      - "crates/holonomy-line/**"
      - "crates/holonomy-seal/**"
      - "vendor/xattr/**"
      - "scripts/qualify-native-ui.sh"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/native-ui.yml"
  pull_request:
  workflow_dispatch:
env:
  CI_DIAG_ISSUE: "128"
permissions:
  contents: read
jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libfontconfig1-dev libasound2-dev libssl-dev xvfb xdotool x11-utils imagemagick mesa-vulkan-drivers
      - name: Resolve, format and compile preview
        shell: bash
        run: |
          cargo fmt --all -- --check 2>&1 | tee native-check.log
          cargo clippy --locked -p holonomy-native --features native-ui -- -D warnings 2>&1 | tee -a native-check.log
          exit "${PIPESTATUS[0]}"
      - name: Test native session boundary
        shell: bash
        run: |
          cargo test --locked -p holonomy-native --lib 2>&1 | tee -a native-check.log
          exit "${PIPESTATUS[0]}"
      - name: Test frontend composition guard
        shell: bash
        run: |
          cargo test --locked -p holonomy-native --features native-ui --bin holonomy-native 2>&1 | tee -a native-check.log
          exit "${PIPESTATUS[0]}"
      - name: Build runnable preview and companion editor
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: |
          cargo build --locked -p holonomy-native --features native-ui
          cargo build --locked -p holonomy-gui --bin holonomy-gui
      - name: Exercise actual native input, encrypted save and reopen under Xvfb
        if: runner.os == 'Linux'
        shell: bash
        env:
          HOLONOMY_NATIVE_SMOKE_PATH: ${{ runner.temp }}/native-smoke.wavefunction
          GPUI_X11_SCALE_FACTOR: "2"
        run: |
          for scale in 1 1.25 1.5 1.75 2; do
            GPUI_X11_SCALE_FACTOR="$scale" xvfb-run -a -s "-screen 0 2560x1800x24" scripts/qualify-native-ui.sh 2>&1 | tee -a native-check.log
            mv native-smoke.png "native-smoke-${scale}.png"
          done
      - name: Upload runnable preview
        uses: actions/upload-artifact@v4
        with:
          name: holonomy-native-preview-${{ matrix.os }}
          path: |
            target/debug/holonomy-native
            target/debug/holonomy-native.exe
            target/debug/holonomy-gui
            target/debug/holonomy-gui.exe
      - name: Capture formatter patch without hiding a failed check
        if: always()
        shell: bash
        run: |
          cargo fmt --all
          git diff > native-format.patch
      - name: Save compiler diagnostics and generated metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-ui-${{ matrix.os }}
          path: |
            Cargo.lock
            crates/holonomy-native/src/main.rs
            native-check.log
            native-format.patch
            native-smoke*.png
            native-failure.png
            native-refused-save.png
            native-unlock.png
            crates/holonomy-native/src/lib.rs
  bridge:
    needs: qualify
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      issues: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: native-ui-*
          path: native-results
      - name: Publish sandbox-readable results
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tar czf native-results.tgz native-results
          base64 -w0 native-results.tgz | split -b 50000 -d - chunk-
          for chunk in chunk-*; do
            { echo "Native UI results $GITHUB_SHA ${chunk}"; cat "$chunk"; echo; } > body.txt
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/${CI_DIAG_ISSUE}/comments" -F body=@body.txt --silent
          done
