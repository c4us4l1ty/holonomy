name: verify-ribbon
on:
  push:
    branches: ['arena/ed487bd8-holonomy']
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: fmt
        run: cargo fmt --all -- --check 2>&1 | tee /tmp/fmt.log; echo "EXIT=$?" >> /tmp/fmt.log
      - name: check-render
        run: cargo check -p holonomy-render --all-targets 2>&1 | tail -200 | tee /tmp/check.log
      - name: check-workspace
        run: cargo check --workspace --all-targets 2>&1 | tail -300 | tee /tmp/checkall.log
      - name: test-ribbon
        run: cargo test -p holonomy --test wordcraft_ribbon 2>&1 | tail -200 | tee /tmp/test-ribbon.log
      - name: test-icons
        run: cargo test -p holonomy-render --test icons 2>&1 | tail -150 | tee /tmp/test-icons.log
      - name: publish
        if: always()
        run: |
          git config user.name "ci"
          git config user.email "ci@example.invalid"
          mkdir -p ci-logs
          cp /tmp/*.log ci-logs/ 2>/dev/null || true
          git add -f ci-logs
          git commit -m "ci: logs [skip ci]" || echo "nothing"
          git push || echo "push failed"
