name: verify-ribbon
on:
  push:
    branches: ['arena/ed487bd8-holonomy']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # **`pipefail`, because `cmd | tail` reports tail's exit code.** The first version of this
      # workflow printed six green steps for a 4-second workspace check, which is not possible on a
      # cold runner -- the pipes had been swallowing the failures.
      - name: verify
        run: |
          set -o pipefail
          mkdir -p ci-logs
          status=0
          run() {
            name="$1"; shift
            echo "===== $name: $* ====="
            if "$@" > "ci-logs/$name.log" 2>&1; then
              echo "RESULT $name PASS" | tee -a ci-logs/summary.log
            else
              echo "RESULT $name FAIL ($?)" | tee -a ci-logs/summary.log
              status=1
            fi
            tail -40 "ci-logs/$name.log"
          }
          run fmt cargo fmt --all -- --check
          run check-render cargo check -p holonomy-render --all-targets
          run check-workspace cargo check --workspace --all-targets
          run test-ribbon cargo test -p holonomy --test wordcraft_ribbon
          run test-icons cargo test -p holonomy-render --test icons
          run test-chrome cargo test -p holonomy-render --test chrome
          run test-all cargo test --workspace --no-fail-fast
          echo "OVERALL=$status" | tee -a ci-logs/summary.log
          exit $status
      - name: capture
        if: always()
        run: |
          mkdir -p shots
          cargo test -p holonomy --test zz_capture -- --nocapture > ci-logs/capture.log 2>&1 || true
          cargo test -p holonomy --test zz_probe -- --nocapture > ci-logs/probe.log 2>&1 || true
          python3 -m pip install --quiet pillow || true
          cat > /tmp/topng.py <<'PY'
          import glob, os
          from PIL import Image
          os.makedirs('shots', exist_ok=True)
          for p in sorted(glob.glob('/tmp/shot/*.ppm')):
              im = Image.open(p)
              stem = os.path.basename(p)[:-4]
              im.save('shots/%s.png' % stem)
              top = min(im.height, 190)
              im.crop((0, 0, im.width, top)).resize((im.width * 2, top * 2), Image.LANCZOS).save(
                  'shots/%s-band2x.png' % stem)
              print(stem, im.size)
          PY
          python3 /tmp/topng.py || true
      - name: publish
        if: always()
        run: |
          set -o pipefail
          git config user.name "ci"
          git config user.email "ci@example.invalid"
          git add -f ci-logs shots
          git commit --allow-empty -m "ci: verification logs [skip ci]" || true
          git push 2>&1 | tail -5
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: dtolnay/rust-toolchain@stable
      - name: baseline-all
        id: base
        run: |
          mkdir -p ci-baseline
          if cargo test --workspace --no-fail-fast > ci-baseline/all.log 2>&1
          then echo "BASELINE all PASS" > ci-baseline/summary.log
          else echo "BASELINE all FAIL" > ci-baseline/summary.log
          fi
          grep -c "FAILED" ci-baseline/all.log >> ci-baseline/summary.log || true
          cat ci-baseline/summary.log
      - name: publish
        if: always()
        run: |
          git config user.name ci
          git config user.email ci@example.invalid
          git add -f ci-baseline
          git commit --allow-empty -m "ci: main baseline [skip ci]"
          git push origin HEAD:refs/heads/ci-baseline-${GITHUB_RUN_ID}
