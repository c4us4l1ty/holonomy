# Holonomy H1 ships bare silicon. The product target is static musl: linking the
# editor against glibc would drag in NSS, dlopen and the dynamic loader, all of which
# are prohibited by the Zero-Compositor Invariant (Plan.md Part 4 §1).
#
# Scope warning: this file is discovered by walking up from the working directory, so a
# `cargo` invocation started inside H2/ will *also* pick it up and switch that build to
# musl. H2 needs glibc and webkit2gtk and cannot be built this way. H2 builds must be
# run with `--target x86_64-unknown-linux-gnu` to override, or with
# CARGO_BUILD_TARGET=x86_64-unknown-linux-gnu in the environment.
[build]
target = "x86_64-unknown-linux-musl"

[target.x86_64-unknown-linux-musl]
# rustc ships self-contained crt objects and libc.a for this target, so no external
# musl-gcc is required. rust-lld is selected explicitly because it is what the
# self-contained linking expects and it produces the `statically linked` ELF header
# the Phase 0 gate asserts. rustc resolves this name inside its own sysroot; it does
# not need a `rust-lld` executable on PATH.
linker = "rust-lld"

# Cargo still links host-side helpers (build scripts / proc macros) for the host
# triple even when the product target is musl. This machine ships no system C
# compiler (/usr/bin/cc does not exist), so host helpers are linked through the
# persistent `cc` wrapper at /home/von/.local/bin/cc, which execs zig cc from
# /home/von/.local/opt (kept out of /tmp so reboots cannot wipe it). Absolute path
# so a stale `cc` wrapper earlier in PATH cannot break `cargo run` / `cargo test`.
# This does not make the shipping artifact glibc-linked: the product target above
# remains static musl. Override with CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER
# if the compiler lives elsewhere.
[target.x86_64-unknown-linux-gnu]
linker = "/home/von/.local/bin/cc"

[net]
offline = false
