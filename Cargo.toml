# HOLONOMY v6 — unified workspace.
#
# Block 1 law: one workspace, one lockfile, every crate a member. The v5 tree had to exile
# its UI crates behind git-fork `[patch.crates-io]` sections; that friction is designed out
# here. `holonomy-old/` and `holonomy-v5-1-0/` are prior art: referenced, never modified,
# never members.

[workspace]
resolver = "2"
members = [
    "crates/holonomy-eye",
    "crates/holonomy-ledger",
    "crates/holonomy-line",
    "crates/holonomy-seal",
    "crates/holonomy-text",
    "crates/xtask",
]
exclude = ["holonomy-old", "holonomy-v5-1-0"]

[workspace.package]
# One bump per roadmap block; sealed at 6.0.0 by Block 10's release gate.
# (No `publish` here: not an inheritable workspace key on all toolchain versions —
# each member manifest sets its own `publish = false`.)
version = "6.0.0-block.3"
edition = "2021"
rust-version = "1.81"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Cryptography pins are inherited verbatim from holonomy-v5-1-0's audited workspace: that set
# ships the reduction-hardened ml-kem 0.3.4 line and a rand_core 0.10 that matches it, and it
# built and passed its two-phase audit tests. Repinning blind would be worse than inheriting.
ml-kem = { version = "0.3.4", default-features = false, features = ["alloc", "zeroize"] }
x25519-dalek = { version = "2.0", default-features = false, features = ["static_secrets", "zeroize"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc", "stream"] }
blake2 = { version = "0.10", default-features = false }
# Feature-unification edge: chacha20poly1305 0.10.1 does not forward Poly1305's optional
# zeroize feature, so holonomy-seal enables it directly for the transitive AEAD state.
poly1305 = { version = "0.8", default-features = false, features = ["zeroize"] }
argon2 = { version = "0.5", default-features = false, features = ["alloc", "zeroize"] }
rand_core = { version = "0.10", default-features = false }
zeroize = { version = "1.8", features = ["zeroize_derive"] }
libc = "0.2"
unicode-normalization = "0.1"

# getrandom is crate-local in crates/holonomy-seal (only the boundary draws entropy; keeping
# it out of workspace.dependencies also keeps clippy's unused-workspace-dependency gate quiet).

[workspace.lints.rust]
# The compiler helps patrol the boundaries the audits used to guard by hand.
unsafe_op_in_unsafe_fn = "warn"
missing_docs = "warn"

[profile.release]
# Security release posture lands with Block 2; Block 1 keeps the profile minimal.
incremental = false
