# SSE2 blitter, damage tracking and the surface tree.
#
# Phase 0 skeleton only. The dependency on holonomy-jail is the single allocation
# chokepoint -- see crates/holonomy-jail/src/lib.rs for why every crate has it.
[package]
name = "holonomy-render"
description = "SSE2 blitter, damage tracking and the surface tree"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
holonomy-jail = { path = "../holonomy-jail" }
holonomy-text = { path = "../holonomy-text" }

[dev-dependencies]
holonomy-assets = { path = "../holonomy-assets" }

# `math_coverage.rs` opens the math face directly to ask whether it carries a glyph, which is the one
# question no amount of counting can answer. Both are already dependencies of `holonomy-assets`, so
# this adds nothing to the binary -- they are dev-only and the face is read at test time.
brotli-decompressor = "6.0"
ttf-parser = "0.25"
