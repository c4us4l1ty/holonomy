# Brotli-compressed fonts, the A8 glyph atlas, and procedural Box Drawing.
#
# Phase 4. The dependency on holonomy-jail is the single allocation chokepoint -- see
# crates/holonomy-jail/src/lib.rs for why every crate has it.
[package]
name = "holonomy-assets"
description = "Brotli-compressed fonts, the A8 glyph atlas and procedural Box Drawing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
holonomy-jail = { path = "../holonomy-jail" }
holonomy-secure = { path = "../holonomy-secure" }
ttf-parser = "0.25"
brotli-decompressor = "6"

[dev-dependencies]
getrandom = "0.4"
