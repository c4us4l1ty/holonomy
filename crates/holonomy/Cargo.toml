# The Holonomy binary: boot sequence, session loop and CLI.
#
# This is the only crate with a bin target. It owns the boot *order*, which is
# load-bearing and not negotiable (PROJECT.md §5 Phase 7):
#
#   mlockall -> open container -> allocate -> open DRM -> open evdev
#     -> unshare -> no_new_privs -> seccomp
#
# Nothing after seccomp may allocate.
#
# Phase 8: a lib target as well as the bin. The session loop lives in the library so the
# integration gate can drive it in-process -- the jail itself cannot be booted from a `#[test]`,
# because `unshare(CLONE_NEWUSER)` returns EINVAL in any multi-threaded process and libtest always
# spawns one. So the *loop* is tested here and the *jail* is entered from `main`, and the two meet
# only in the binary.
[package]
name = "holonomy"
description = "Holonomy bare-silicon word processor, encrypted container and sealed OS jail"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# Gates every path that needs real hardware. Phase 0 establishes the flag so the
# dual-backend shape is in place from the first commit; nothing reads it yet.
# PROJECT.md §2.7: CI must never depend on hardware-only paths.
hardware = []
# The developer window: a real window on a real desktop, so a human can type a document without `sudo`.
#
# Off by default, and NOT part of the product. The bare-silicon path is `hardware` plus the jail; this is
# the other end of the `Scanout`/`InputSource` pair, for a machine that has a compositor. Enabling it
# changes the binary: `tests/release_artifact.rs` asserts that a default-features release build contains
# no X11 in it, and the seccomp census (`tests/census_session.rs`) covers the sealed path, not this one.
desktop = ["holonomy-display/desktop", "holonomy-input/desktop", "dep:holonomy-x11"]

[lib]
name = "holonomy"
path = "src/lib.rs"

[[bin]]
name = "holonomy"
path = "src/main.rs"

[dependencies]
# holonomy-assets re-exports from here because `include_bytes!` data is only visible
# to the crate that declares it (PROJECT.md §4).
holonomy-assets = { path = "../holonomy-assets" }
holonomy-container = { path = "../holonomy-container" }
holonomy-crypto = { path = "../holonomy-crypto" }
holonomy-display = { path = "../holonomy-display" }
holonomy-export = { path = "../holonomy-export" }
holonomy-geometry = { path = "../holonomy-geometry" }
# Phase 9C: the PNG decoder, the integer scaler and the Iceberg cache. The binary crate is where
# `miniz_oxide` is reachable from, so §2.9.1's 60 KiB decoder budget is one crate's edge.
holonomy-image = { path = "../holonomy-image" }
holonomy-input = { path = "../holonomy-input" }
holonomy-jail = { path = "../holonomy-jail" }
holonomy-render = { path = "../holonomy-render" }
holonomy-secure = { path = "../holonomy-secure" }
holonomy-text = { path = "../holonomy-text" }
# Only for the developer window: the driver's own key events and the window manager's messages.
holonomy-x11 = { path = "../holonomy-x11", optional = true }