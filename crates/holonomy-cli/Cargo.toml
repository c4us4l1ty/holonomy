[package]
name = "holonomy-cli"
description = "The `holonomy` binary: session, save, and the `--check` health gate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# No `wordcraft` in this graph, on purpose. The editor front end lives in `holonomy-ui`, which
# cannot be compiled everywhere; the thing that tells a user whether their container is intact
# must be buildable everywhere.
[[bin]]
name = "holonomy"
path = "src/main.rs"

[dependencies]
holonomy-core = { path = "../holonomy-core" }
# Only for the pad-plan comparison in the store's tests, but a dev-dependency on a path crate is
# still a dependency graph edge: it is declared here rather than under `[dev-dependencies]` so the
# same feature resolution is used. `holonomy-usb` has no `wordcraft` in its graph either.
holonomy-usb = { path = "../holonomy-usb" }
holonomy-crypto = { path = "../holonomy-crypto" }
holonomy-session = { path = "../holonomy-session" }
holonomy-runtime = { path = "../holonomy-runtime" }
libc = { workspace = true }
# The store's stand-in pad material, and the image digest it reports alongside a save.
blake2 = { workspace = true }

[lints.rust]
missing_docs = "deny"
