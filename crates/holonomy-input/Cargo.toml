# Evdev input, code-based keymap and script injection.
#
# `libc` for the three errno values and the O_NONBLOCK flag on a device node. The dependency on
# holonomy-jail is the single allocation chokepoint -- see crates/holonomy-jail/src/lib.rs for why
# every crate has it.
[package]
name = "holonomy-input"
description = "Evdev input, code-based keymap and script injection"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The developer window. Off by default: it pulls in an X11 client, and the sealed boot chain has no use
# for one -- the production input path is `evdev`.
desktop = ["dep:holonomy-x11", "dep:unicode-normalization"]

[dependencies]
holonomy-jail = { path = "../holonomy-jail" }
# Only for the developer window, and only the event type: this crate interprets key events, it does not
# speak any protocol.
holonomy-x11 = { path = "../holonomy-x11", optional = true }
libc = "0.2"
# Desktop-only compose normalization; the sealed evdev path does not link it.
unicode-normalization = { version = "0.1", optional = true }