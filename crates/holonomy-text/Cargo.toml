[package]
name = "holonomy-text"
description = "The Spine: immutable slab-tree document engine (Block 4). Viewport-bounded residency, path-copy edits, measured zero-allocation keystrokes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# Wipe-on-drop for resident plaintext. Not a crypto primitive: the seal stays the only crate that
# links one (RFC-001 §1), and the Spine never sees a key.
zeroize.workspace = true

[dev-dependencies]
# The counting allocator this crate's keystroke gate installs as its global allocator. Dev-only:
# the shipped Spine never depends on the ledger.
holonomy-ledger = { path = "../holonomy-ledger" }
# The commit boundary is proven against the real world-line and the real seal — no mock of the
# container, the durability barrier or the MMR. Dev-only, and one-directional: `holonomy-line`
# does not depend on `holonomy-text`, and the library speaks to it through `SegmentSink` /
# `SegmentSource` traits, so the shipped Spine still links neither.
holonomy-line = { path = "../holonomy-line" }
holonomy-seal = { path = "../holonomy-seal" }
