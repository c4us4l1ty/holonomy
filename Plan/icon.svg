    <!-- Warm central background -->
    <radialGradient id="bgCenter" cx="50%" cy="48%" r="68%">
      <stop offset="0%"   stop-color="#c2ad96"/>
      <stop offset="24%"  stop-color="#c2ad96"/>
      <stop offset="46%"  stop-color="#c2ad96"/>
      <stop offset="68%"  stop-color="#c2ad96"/>
      <stop offset="86%"  stop-color="#c2ad96"/>
      <stop offset="100%" stop-color="#f4ece4"/>
