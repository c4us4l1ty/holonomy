    <!-- Subtle directional warmth -->
    <linearGradient id="bgWarmth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#000000" stop-opacity="0.82"/>
      <stop offset="28%"  stop-color="#000000" stop-opacity="0.30"/>
      <stop offset="52%"  stop-color="#c2ad96" stop-opacity="0.08"/>
      <stop offset="76%"  stop-color="#f4ece4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f4ece4" stop-opacity="0.78"/>
    </linearGradient>

