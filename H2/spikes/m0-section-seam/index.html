<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>M0 — section seam spike</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #f6f7f9;
        color: #1f2328;
      }
      #toolbar {
        position: sticky; top: 0; z-index: 10;
        display: flex; gap: 8px; align-items: center;
        padding: 8px 12px; background: #fff;
        border-bottom: 1px solid #d8dce1;
        font-size: 13px;
      }
      #toolbar b { font-weight: 600; }
      #spacer-top { background: #eef1f5; }
      #spacer-bottom { background: #eef1f5; }
      .page {
        background: #fff; max-width: 46rem; margin: 0 auto 12px;
        padding: 2.5rem 3rem; box-shadow: 0 1px 3px rgba(0,0,0,.12);
      }
      #viewport-host .chunk-slice { margin-bottom: 12px; }
      .chunk-slice[data-frozen] { position: relative; }
      .chunk-slice[data-frozen]::after {
        content: 'frozen'; position: absolute; top: 0; right: 0;
        font-size: 10px; color: #8b949e; background: #f0f2f5;
        padding: 1px 5px; border-radius: 3px; pointer-events: none;
      }
      .ProseMirror { outline: none; min-height: 4rem; }
      .ProseMirror p { margin: 0 0 .75rem; }
      /* Keep the corpus readable rather than faithfully typeset; the spike
         measures editor mechanics, not visual design. */
      pre { background: #f6f8fa; padding: .6rem; overflow: auto; }
      table { border-collapse: collapse; }
      td, th { border: 1px solid #d0d7de; padding: 4px 6px; }
      .dim { color: #6b7280; }
    </style>
  </head>
  <body>
    <div id="toolbar">
      <b>M0 seam spike</b>
      <span class="dim">strategy</span><span id="strategy-name">—</span>
      <span class="dim">docSize</span><span id="doc-size">—</span>
      <span class="dim">domNodes</span><span id="dom-nodes">—</span>
    </div>
    <div id="scroll-container" style="overflow-y: auto; height: calc(100vh - 41px);">
      <div id="spacer-top"></div>
      <div id="viewport-host"></div>
      <div id="spacer-bottom"></div>
    </div>
    <script type="module" src="/src/harness.ts"></script>
  </body>
</html>
